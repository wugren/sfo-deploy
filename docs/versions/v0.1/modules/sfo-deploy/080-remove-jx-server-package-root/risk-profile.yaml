schema_version: 1
task_manifest: task.yaml
change_ids: ["CHG-remove-jx-server-package-root"]
source_bindings:
  proposal: proposal.md
  design_source: design.md

risks:
  contract:
    applies: true
    evidence:
      - proposal.md
      - design.md
      - tests/integration/versioned_release.test.ts
    required_checks:
      - 缺省 strip-single-root 规则与既有平铺/多顶层包布局契约同步；jx-server/jx-web 配置目标和载荷路径一致
  data:
    applies: true
    evidence:
      - design.md
      - src/remote_deployment.ts
      - src/versioned_release_management.ts
    required_checks:
      - 布局提升只发生在已校验隔离候选目录内，不改变 tar 安全校验、latest 切换或失败恢复语义
  security:
    applies: true
    evidence:
      - design.md
      - src/remote_deployment.ts
    required_checks:
      - 远端检查、移动和清理命令保持绝对路径、受限 root 边界和非 root run_as 语义
      - 不因顶层成员名或命令输出引入路径注入、越界移动或权限放宽
  runtime:
    applies: true
    evidence:
      - design.md
      - src/execution.ts
      - examples/eleph-server-multipass/clusters/multipass/apps/jx-server/app.yaml
    required_checks:
      - 提升后 jx-server/jx-web stage/activate 顺序正确；jx-server 直接从 latest/jx-server.jar 启动
      - 真实 multipass 部署成功并确认新版本无 server/web 层
  build:
    applies: true
    evidence:
      - deno.json
      - src/remote_deployment.ts
      - tests/integration/versioned_release.test.ts
    required_checks:
      - deno task check 通过
      - deno task test 通过
      - 改动文件通过 fmt/lint
  ui:
    applies: false
    evidence: 本仓库无图形界面或无障碍表面；部署 CLI 输出不是 UI。
    required_checks: []
  harness:
    applies: false
    evidence: 本任务不修改 Harness 规则、索引或检查器语义。
    required_checks: []
