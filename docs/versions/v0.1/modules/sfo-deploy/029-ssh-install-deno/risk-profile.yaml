schema_version: 1
task_manifest: task.yaml

# `risk-profile-check.py --prepare --task <packet>/task.yaml` writes these
# task/change and source bindings. Proposal/design changes then invalidate this
# profile until its judgments are reviewed and the bindings are prepared again.
change_ids: ["CHG-ssh-deno-install", "CHG-ssh-deno-docs"]
source_bindings:
  proposal: proposal.md
  design_source: design.md

# One task-level matrix. Stage documents reference this file and never copy it.
# Proposal owns applies/evidence. Design owns required_checks for applicable
# risks. Testing implements those checks; acceptance may consult the profile
# but does not require or verify risk evidence as an acceptance gate.
risks:
  contract:
    applies: true
    evidence: [
      "src/cli.ts",
      "src/integration.ts",
      "src/results.ts",
      "README.md",
      "docs/guides/sfo-deploy-cluster-configuration.md",
    ]
    required_checks: [
      "unit: install-deno 拒绝与 apps/environments/withDependencies/releaseId 混用",
      "unit: ACTION_DESCRIPTIONS/帮助与 CLI_ACTIONS 同步",
      "integration: 结果 JSON 结构、退出码 0/2/3/4/130 稳定",
    ]
  data:
    applies: false
    evidence: 不写集群配置、发布历史或任何持久 schema；安装结果只作为单次 JSON 输出。
    required_checks: []
  security:
    applies: true
    evidence: ["src/ssh_install.ts", "src/transport.ts", "src/config.ts"]
    required_checks: [
      "unit: --deno-version/--install-to 拒绝非法字符与控制字符",
      "unit: 安装命令通过 argv 传递，用户输入不进入 shell 拼接",
      "unit: SSH 连接失败沿用已知主机/私钥严格校验并 fail-closed",
      "integration: 缺省全量非交互未 --yes 时取消且不连远端",
    ]
  runtime:
    applies: true
    evidence: ["src/ssh_install.ts", "src/integration.ts", "src/cli.ts"]
    required_checks: [
      "unit: 已满足版本时跳过安装（present）",
      "unit: 安装失败记录 failed 且会话清理仍执行",
      "unit: 安装后验证命令必须成功且版本主号 >= 2",
    ]
  build:
    applies: true
    evidence: ["src/ssh_install.ts", "docs/guides/sfo-deploy-cluster-configuration.md"]
    required_checks: [
      "unit: 默认版本常量格式严格、安装后版本复验一致",
      "integration: 文档中的命令示例与默认安装路径一致",
    ]
  ui:
    applies: false
    evidence: 不涉及 UI、导航、无障碍或本地化工作流。
    required_checks: []
  harness:
    applies: false
    evidence: 不修改 Harness 规则、检查器或测试基础结构的实现。
    required_checks: []
