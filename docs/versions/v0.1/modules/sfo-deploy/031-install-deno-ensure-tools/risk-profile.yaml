schema_version: 1
task_manifest: task.yaml

# `risk-profile-check.py --prepare --task <packet>/task.yaml` 写入任务/变更与设计源绑定；
# 提案或设计变更后需复核本文件并重新 prepare。
change_ids: ["CHG-deno-ensure-tools", "CHG-deno-ensure-tools-docs"]
source_bindings:
  proposal: proposal.md
  design_source: design.md

# 单任务矩阵。阶段文档引用本文件，不复制矩阵。
# 提案拥有 applies/evidence；设计为适用项补 required_checks；测试实现这些检查。
risks:
  contract:
    applies: true
    evidence: [
      "src/ssh_install.ts",
      "src/integration.ts",
      "docs/guides/sfo-deploy-cluster-configuration.md",
      "README.md",
    ]
    required_checks: [
      "unit: 未新增 CLI 参数，参数/结果 JSON/退出码语义不变",
      "unit: 缺失工具且可提权时自动补齐并继续原流程",
      "unit: 无缺失工具时行为与 030 修复后一致",
    ]
  data:
    applies: false
    evidence: 不写集群配置、发布历史或任何持久 schema；安装结果仍只作为单次 JSON 输出。
    required_checks: []
  security:
    applies: true
    evidence: ["src/ssh_install.ts", "src/transport.ts"]
    required_checks: [
      "unit: 包管理器检测/安装命令全部来自固定模板，用户输入不进入命令",
      "unit: 提权不可用映射 preflight 失败（退出码 3）",
      "unit: 支持/不支持包管理器边界 fail-closed 且提示可行动",
    ]
  runtime:
    applies: true
    evidence: ["src/ssh_install.ts", "src/integration.ts"]
    required_checks: [
      "unit: 已满足版本时跳过工具补齐与安装（present）",
      "unit: apt-get/apk/dnf/yum 四种包管理器分支均调用固定命令",
      "unit: 安装失败/复测仍缺工具映射 transport（退出码 4）且会话清理",
      "dv: 缺工具场景完整走到 installed",
    ]
  build:
    applies: true
    evidence: ["src/ssh_install.ts", "docs/guides/sfo-deploy-cluster-configuration.md"]
    required_checks: [
      "unit: 安装脚本仍固定 vX.Y.Z 并通过传输层 argv 校验",
      "integration: 文档默认路径与示例命令一致",
    ]
  ui:
    applies: false
    evidence: 不涉及 UI、导航、无障碍或本地化工作流。
    required_checks: []
  harness:
    applies: false
    evidence: 不修改 Harness 规则、检查器或测试基础结构的实现。
    required_checks: []
