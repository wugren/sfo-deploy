schema_version: 1
task_manifest: task.yaml
change_ids: ["CHG-multipass-deploy-success"]
source_bindings:
  proposal: proposal.md
  design_source: design.md

risks:
  contract:
    applies: false
    evidence: 不改变配置 schema、公开 CLI 输出契约或包/集群版本兼容性；CLI 命令形状保持用户输入不变。
    required_checks: []
  data:
    applies: true
    evidence:
      - design.md
      - src/versioned_release_management.ts
      - src/execution.ts
    required_checks:
      - stage 失败不提交 latest 或 marker；activate 失败按 previous latest/marker 恢复，且临时资源清理路径可验证
      - 同一 deploy 重试不会因遗留合法回滚状态误判版本目录、latest 或 marker 不一致
  security:
    applies: true
    evidence:
      - design.md
      - src/service_management.ts
    required_checks:
      - daemon-reload 与其他 systemctl 动作仍使用同一特权、超时和 unit 参数校验路径
      - 新增或修改的远端命令不引入路径注入、秘密输出或权限放宽
  runtime:
    applies: true
    evidence:
      - design.md
      - src/service_management.ts
      - src/execution.ts
      - src/versioned_release_management.ts
    required_checks:
      - systemctl daemon-reload 的完整 argv 不携带 unit，而 enable/start/restart 等继续携带 unit
      - prepare 与 restore 路径均通过同一命令构造修正
      - 真实 multipass deploy 最终 5/5 succeeded，服务状态符合 enabled/active 配置
  build:
    applies: true
    evidence:
      - deno.json
      - src/service_management.ts
      - tests/unit/service_management.test.ts
    required_checks:
      - deno task check 通过
      - deno task test 通过
      - 改动文件通过 fmt/lint
  ui:
    applies: false
    evidence: 本仓库无图形界面或无障碍表面；部署 CLI 进度输出属于运行链而非 UI。
    required_checks: []
  harness:
    applies: false
    evidence: 本任务不修改 Harness 规则、索引或检查器语义。
    required_checks: []
