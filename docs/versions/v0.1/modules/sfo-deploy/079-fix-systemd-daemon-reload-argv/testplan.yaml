schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: false
evidence_inputs: ["src/service_management.ts", "src/execution.ts", "tests/unit/service_management.test.ts", "tests/dv/versioned_deploy_order.test.ts", "tests/integration/versioned_release.test.ts", "examples/eleph-server-multipass/clusters/multipass/apps/jx-server/app.yaml", "examples/eleph-server-multipass/clusters/multipass/apps/jx-web/app.yaml"]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 仓库类型闭包
      change_ids: ["CHG-multipass-deploy-success"]
      run: ["deno", "task", "check"]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - change_ids: ["CHG-multipass-deploy-success"]
    reason: 真实 multipass/systemd 部署作为任务运行证据记录，不纳入可重复的自动化测试计划。
levels:
  unit:
    mode: enabled
    summary: 覆盖 systemctl argv、failed unit reset 和 missing unit 边界
    test_targets: ["tests/unit/service_management.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用记录型 RemoteSession，不连接真实节点。"]
    steps:
      - id: U1
        name: systemd 命令形状与失败状态
        change_ids: ["CHG-multipass-deploy-success"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-run", "tests/unit/service_management.test.ts"]
  dv:
    mode: enabled
    summary: 覆盖 stage/activate、失败恢复与静态服务延迟动作
    test_targets: ["tests/dv/versioned_deploy_order.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用本地临时目录和记录型会话。"]
    steps:
      - id: D1
        name: versioned 部署顺序与恢复
        change_ids: ["CHG-multipass-deploy-success"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/dv/versioned_deploy_order.test.ts"]
  integration:
    mode: enabled
    summary: 覆盖 multipass 制品布局、versioned 发布与真实包路径契约
    test_targets: ["tests/integration/versioned_release.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用本地 fixtures 和伪远端命令，不连接真实节点。"]
    steps:
      - id: I1
        name: multipass builtin layout contract
        change_ids: ["CHG-multipass-deploy-success"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/integration/versioned_release.test.ts"]
