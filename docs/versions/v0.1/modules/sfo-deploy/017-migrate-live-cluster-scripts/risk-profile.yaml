schema_version: 1
task_manifest: task.yaml

change_ids: ["CHG-live-cluster-ts-migration", "CHG-live-cluster-ts-regression"]
source_bindings:
  proposal: proposal.md
  design_source: pipeline/plan.md

risks:
  contract:
    applies: true
    evidence:
      - proposal.md：`## Scope / ### In scope` 要求把实时集群生命周期 `.py`、旧脚本声明和机器运行时迁移为 TypeScript 权限对象与 Deno 合同，同时保持部署计划语义不变
      - pipeline/plan.md：`## Exported Interfaces` 与 `## Consumer Migration Closure` 逐项绑定 machines、App、四类环境和 21 个脚本的旧合同、新路径、具体消费者及迁移状态
    required_checks:
      - 每个实时集群均可由当前严格配置加载器装载并生成计划，计划只包含 Deno、`.ts` 与规范化 run/net 权限
      - 实时集群范围内不存在生命周期 `.py`、旧字符串脚本声明或机器 python 字段，且防回退检查能拒绝这些旧合同
  data:
    applies: true
    evidence:
      - proposal.md：`## Scope / ### In scope`、`### Out of scope` 与 `## Risks` 要求保留节点地址、bootstrap、known_hosts、secrets 和历史不可变证据，禁止用模板整体覆盖实时实例
      - pipeline/plan.md：`## Acceptance Baseline`、`## State Ownership` 与 `## Failure Flows / 实例状态保护` 将实例状态设为单一保护集合，任何内容变化都阻断完成且不得从模板重建
    required_checks:
      - 迁移前后 bootstrap、known_hosts、secrets、节点地址及其他非生命周期实例状态逐文件保持不变
      - `.harness/baselines`、历史发布证据、已完成任务包和旧快照均不被扫描器清理或迁移逻辑修改
  security:
    applies: true
    evidence:
      - proposal.md：`### Out of scope` 与 `## Risks` 固定 Deno 文件、网络和子进程权限边界，并要求逐动作比对 run/net 白名单且不得暴露实时秘密
      - pipeline/plan.md：`## Exported Interfaces / 文件级消费合同` 与 `## Failure Flows / 权限同步` 规定只同步模板既定 path/run/net，禁止通配、裸权限和模板以外的能力
    required_checks:
      - 每个实时动作的 run/net 白名单与对应规范模板逐项一致，默认 net 为空且只有既定健康检查授权 `127.0.0.1:8080`
      - 迁移、检查和失败输出不读取或打印私钥及秘密内容，也不扩大 Deno 直接文件、网络、FFI 或子进程权限合同
  runtime:
    applies: true
    evidence:
      - proposal.md：`## Scope / ### In scope`、`## Success Criteria` 与 `## Risks` 要求 21 个实时生命周期动作保持部署顺序、服务配置、健康检查、回滚及失败语义
      - pipeline/plan.md：`## Dependency Graphs` 的迁移状态图、`## File-Level Migration Map` 与 `## Failure Flows / 脚本与 YAML 原子迁移` 固化逐文件配对、原子切换和部分状态失败关闭
    required_checks:
      - 21 个 TypeScript 对应脚本保持模板已验证的命令、参数、配置渲染、健康检查、原子替换和失败退出语义
      - 实时配置的环境依赖、动作顺序、秘密声明、模板路径、制品路径和回滚所需部署语义保持不变
  build:
    applies: true
    evidence:
      - proposal.md：`## Scope / ### In scope` 与 `## Risks` 要求迁移后的脚本通过 Deno 静态检查，并核对生成路径和增加防回退验证以阻止旧合同再生
      - pipeline/plan.md：`## Acceptance Baseline`、`## External Runtime Dependencies` 与 `## Failure Flows / 生成路径` 固化 shell/PowerShell 继续复制当前 TypeScript 模板，若仍生成旧输出则返回 D-1 扩展绑定
    required_checks:
      - 所有实时 TypeScript 生命周期脚本通过离线 `deno check`，配置与计划检查可重复执行
      - PowerShell 与 shell 生成路径继续从当前 TypeScript 模板创建集群，防回退扫描覆盖现存实时目录和新生成目录
  ui:
    applies: false
    evidence: 本任务不改变 UI、导航、可访问性、本地化或交互流程。
    required_checks: []
  harness:
    applies: false
    evidence: 本任务消费既有 Harness 自动流水线和任务测试入口，不修改 Harness 规则、检查器或流程语义。
    required_checks: []
