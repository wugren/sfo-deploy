schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: breaking
  crate_root_export_change: true
  build_surface_change: true
  documentation_examples_affected: true
evidence_inputs: [
  "src",
  "tests",
  "README.md",
  "docs/guides/sfo-deploy-cluster-configuration.md",
  "examples",
  "examples/eleph-server-multipass",
]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: external-positive
      assertion: new-path-compiles
      name: 新契约：format + ${SECRET_NAME} 装载和计划可编译执行
      change_ids: [
        "CHG-secret-placeholder-schema",
        "CHG-placeholder-rendering-runtime",
        "CHG-placeholder-plan-history-cli",
        "CHG-placeholder-docs-tests",
      ]
      run: [
        "deno",
        "test",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/unit/app_management_config.test.ts",
      ]
    - id: C2
      kind: external-negative
      assertion: old-path-rejected-for-removed-symbol
      name: 旧契约：management.configs[].updater 装载定向拒收
      change_ids: [
        "CHG-secret-placeholder-schema",
        "CHG-placeholder-rendering-runtime",
        "CHG-placeholder-plan-history-cli",
        "CHG-placeholder-docs-tests",
      ]
      run: [
        "deno",
        "test",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/unit/app_management_config.test.ts",
      ]
    - id: C3
      kind: external-positive
      assertion: new-path-compiles
      name: 公共导出新契约：ManagedSecretReference 可从模块根消费
      change_ids: [
        "CHG-secret-placeholder-schema",
        "CHG-placeholder-rendering-runtime",
        "CHG-placeholder-plan-history-cli",
        "CHG-placeholder-docs-tests",
      ]
      run: ["deno", "check", "--frozen", "tests/contract/app_management_consumer.ts"]
    - id: C4
      kind: removed-symbol-scan
      assertion: no-unallowlisted-old-symbol-references
      name: 已删除 updater 类型/协议的仓库级旧符号扫描
      change_ids: [
        "CHG-secret-placeholder-schema",
        "CHG-placeholder-rendering-runtime",
        "CHG-placeholder-plan-history-cli",
        "CHG-placeholder-docs-tests",
      ]
      run: [
        "python3",
        "harness/scripts/consumer-closure-check.py",
        "--root",
        ".",
        "--version",
        "v0.1",
        "--module",
        "sfo-deploy",
        "--task-name",
        "051-secret-placeholder-config",
      ]
    - id: C5
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: Deno 仓库编译与类型闭包
      change_ids: [
        "CHG-secret-placeholder-schema",
        "CHG-placeholder-rendering-runtime",
        "CHG-placeholder-plan-history-cli",
        "CHG-placeholder-docs-tests",
      ]
      run: ["deno", "task", "check"]
    - id: C6
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: README/指南/示例契约使用 format + 秘密占位符
      change_ids: [
        "CHG-secret-placeholder-schema",
        "CHG-placeholder-rendering-runtime",
        "CHG-placeholder-plan-history-cli",
        "CHG-placeholder-docs-tests",
      ]
      run: [
        "deno",
        "run",
        "--frozen",
        "--allow-read",
        "tests/contract/verify_app_management_contract.ts",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps: []
levels:
  unit:
    mode: enabled
    summary: 覆盖秘密类型、占位符装载/渲染、计划/快照形状与错误边界。
    test_targets: [
      "tests/unit/app_management_config.test.ts",
      "tests/unit/managed_config_generation.test.ts",
      "tests/unit/history.test.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["离线临时目录夹具。"]
    steps:
      - id: U1
        name: 装载与秘密声明契约
        change_ids: ["CHG-secret-placeholder-schema"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/app_management_config.test.ts",
        ]
      - id: U2
        name: 结构化骨架与占位符渲染契约
        change_ids: ["CHG-placeholder-rendering-runtime"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/managed_config_generation.test.ts",
        ]
      - id: U3
        name: 远端更新器单元/集成级核心契约
        change_ids: ["CHG-placeholder-rendering-runtime"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/config_updater.test.ts",
        ]
      - id: U4
        name: 计划/快照编码与旧 updater 拒收
        change_ids: ["CHG-placeholder-plan-history-cli"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/history.test.ts",
        ]
  dv:
    mode: enabled
    summary: 覆盖 managed 生命周期、秘密隔离、失败恢复和事务顺序。
    test_targets: ["tests/dv/app_management_execution.test.ts", "tests/dv/execution.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用受控 fake transport。"]
    steps:
      - id: D1
        name: managed 配置生命周期与失败恢复
        change_ids: ["CHG-placeholder-rendering-runtime", "CHG-placeholder-plan-history-cli"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/dv/app_management_execution.test.ts",
          "tests/dv/execution.test.ts",
        ]
  integration:
    mode: enabled
    summary: 覆盖 OpenSSH/bundle/渲染器、示例集群、文档契约和全量回归。
    test_targets: [
      "tests/integration",
      "tests/contract/verify_app_management_contract.ts",
      "tests/integration/config_fingerprint.test.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["契约脚本只读仓库；集成测试自建临时目录。"]
    steps:
      - id: I1
        name: managed 传输与部署协议
        change_ids: ["CHG-placeholder-rendering-runtime"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/managed_transport_security.test.ts",
          "tests/integration/remote_deployment.test.ts",
          "tests/integration/config_fingerprint.test.ts",
        ]
      - id: I2
        name: 示例集群可装载与计划
        change_ids: ["CHG-secret-placeholder-schema", "CHG-placeholder-docs-tests"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/environment_placement.test.ts",
        ]
      - id: I3
        name: 全量仓库回归
        change_ids: [
          "CHG-secret-placeholder-schema",
          "CHG-placeholder-rendering-runtime",
          "CHG-placeholder-plan-history-cli",
          "CHG-placeholder-docs-tests",
        ]
        run: ["deno", "task", "test"]
      - id: I4
        name: 文档与示例契约
        change_ids: ["CHG-placeholder-docs-tests"]
        run: [
          "deno",
          "run",
          "--frozen",
          "--allow-read",
          "tests/contract/verify_app_management_contract.ts",
        ]
      - id: I5
        name: lint/fmt/build surface
        change_ids: ["CHG-placeholder-rendering-runtime", "CHG-placeholder-docs-tests"]
        run: ["deno", "task", "lint"]
