schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: none
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: [
  "src/config.ts",
  "src/integration.ts",
  "src/results.ts",
  "src/mod.ts",
  "tests/unit/config_planning.test.ts",
  "tests/unit/install_deno_cli.test.ts",
  "tests/dv/install_deno.test.ts",
  "tests/integration/install_deno_cli.test.ts",
  "tests/contract/verify_install_deno_contract.ts",
  "README.md",
  "docs/guides/sfo-deploy-cluster-configuration.md",
  "examples/eleph-server-multipass/README.md",
  "docs/versions/v0.1/modules/sfo-deploy/032-install-deno-sync-config/testplan.yaml",
]
contract_checks:
  mode: enabled
  steps:
    - id: docs-contract
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 验证 README/指南/示例 README 的 install-deno 示例与自动同步说明一致
      change_ids: ["CHG-install-deno-sync-config", "CHG-install-deno-sync-docs"]
      run: ["deno", "run", "--allow-read", "tests/contract/verify_install_deno_contract.ts"]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - id: atomic-write-permission-failure
    owner: sfo-deploy 维护者与具备受限文件系统权限的 CI 环境
    reason: 当前容器以 root 运行，无法可靠构造目标目录不可写或 rename 覆盖失败的权限场景
    acceptance_impact: 自动测试覆盖正常原子替换、临时文件清理与 flow-style 同步失败；权限型 rename 失败依赖代码级原子替换设计与人工/受控环境验证
  - id: real-ssh-install
    owner: sfo-deploy 维护者与具备隔离目标机的运维人员
    reason: 当前仓库环境没有可安全修改的真实 SSH 目标机、受信任 host key 与可被允许提权的远端身份
    acceptance_impact: 自动测试以内存 SSH 替身验证安装与配置同步编排，不证明某个具体发行版在真实目标机上的命令兼容性
levels:
  unit:
    mode: enabled
    summary: 覆盖 syncMachineDenos 输入/替换/插入/CRLF/临时文件清理分支，以及既有 CLI 与结果序列化回归。
    test_targets: ["tests/unit/config_planning.test.ts", "tests/unit/install_deno_cli.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["SSH 行为用 FakeSession 替身；配置写回使用临时目录真实文件。"]
    steps:
      - id: U1
        name: machines.yaml deno 字段同步写回函数
        change_ids: ["CHG-install-deno-sync-config"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/config_planning.test.ts",
        ]
      - id: U2
        name: install-deno CLI 参数与 InstallDenoResult 序列化回归
        change_ids: ["CHG-install-deno-sync-config"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/install_deno_cli.test.ts",
        ]
  dv:
    mode: enabled
    summary: 使用临时集群目录与 FakeTransport 验证 run() 全链：安装/present/失败后配置同步、同步失败映射与确认门禁。
    test_targets: ["tests/dv/install_deno.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: [
        "不连接真实 SSH 目标；集群配置在临时目录生成并经真实 loadCluster 读取。",
      ]
    steps:
      - id: D1
        name: install-deno run() 主流程/生命周期/失败/同步失败
        change_ids: ["CHG-install-deno-sync-config", "CHG-install-deno-sync-docs"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/dv/install_deno.test.ts",
        ]
  integration:
    mode: enabled
    summary: 验证公开 CLI 动作列表、模块导出、CLI JSON 输出与文档契约不回归。
    test_targets: ["tests/integration/install_deno_cli.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["CLI 端到端输出使用注入的 runAction 返回 InstallDenoResult。"]
    steps:
      - id: I1
        name: install-deno 公开动作/导出/JSON 输出契约
        change_ids: ["CHG-install-deno-sync-config", "CHG-install-deno-sync-docs"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/install_deno_cli.test.ts",
        ]
