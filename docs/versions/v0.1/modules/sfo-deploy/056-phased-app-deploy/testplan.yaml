schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: ["src", "tests", "examples", "README.md", "docs/guides"]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: external-positive
      assertion: new-path-compiles
      name: 公共消费者编译计划类型
      change_ids: ["CHG-phased-deploy-planning", "CHG-phased-deploy-execution", "CHG-phased-deploy-docs-tests"]
      run: ["deno", "check", "--frozen", "tests/contract/app_management_consumer.ts"]
    - id: C2
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: README/指南/App 管理契约
      change_ids: ["CHG-phased-deploy-planning", "CHG-phased-deploy-execution", "CHG-phased-deploy-docs-tests"]
      run: ["deno", "run", "--frozen", "--allow-read", "tests/contract/verify_app_management_contract.ts"]
    - id: C3
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 仓库与远端脚本编译闭包
      change_ids: ["CHG-phased-deploy-planning", "CHG-phased-deploy-execution", "CHG-phased-deploy-docs-tests"]
      run: ["deno", "check", "--frozen", "src/mod.ts", "src/main.ts", "src/cli.ts", "src/remote_runtime/versioned_release.ts"]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps: []
levels:
  unit:
    mode: enabled
    summary: 覆盖阶段计划、屏障、custom deploy 兼容和历史快照。
    test_targets: ["tests/unit/app_management_config.test.ts", "tests/unit/history.test.ts", "tests/unit/history_regressions.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["离线临时目录夹具。"]
    steps:
      - id: U1
        name: 分阶段计划与屏障
        change_ids: ["CHG-phased-deploy-planning", "CHG-phased-deploy-execution"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/unit/app_management_config.test.ts"]
      - id: U2
        name: 发布历史兼容
        change_ids: ["CHG-phased-deploy-planning", "CHG-phased-deploy-execution", "CHG-phased-deploy-docs-tests"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/unit/history.test.ts", "tests/unit/history_regressions.test.ts"]
  dv:
    mode: enabled
    summary: 覆盖 managed 发布顺序、失败恢复和执行器隔离。
    test_targets: ["tests/dv/app_management_execution.test.ts", "tests/dv/execution.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用受控 fake transport。"]
    steps:
      - id: D1
        name: managed App/执行器回归
        change_ids: ["CHG-phased-deploy-planning", "CHG-phased-deploy-execution", "CHG-phased-deploy-docs-tests"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/dv/app_management_execution.test.ts", "tests/dv/execution.test.ts"]
  integration:
    mode: enabled
    summary: 覆盖 stage/activate 行为、文档契约和 lint。
    test_targets: ["tests/integration/versioned_release.test.ts", "tests/contract/verify_app_management_contract.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["契约脚本只读仓库；发布脚本测试自建临时目录。"]
    steps:
      - id: I1
        name: 内置 versioned stage/activate
        change_ids: ["CHG-phased-deploy-planning", "CHG-phased-deploy-execution", "CHG-phased-deploy-docs-tests"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/integration/versioned_release.test.ts"]
      - id: I2
        name: lint 与文档闭包
        change_ids: ["CHG-phased-deploy-docs-tests"]
        run: ["deno", "task", "lint"]
