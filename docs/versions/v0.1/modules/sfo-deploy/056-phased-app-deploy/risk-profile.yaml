schema_version: 1
task_manifest: task.yaml

change_ids: ["CHG-phased-deploy-planning", "CHG-phased-deploy-execution", "CHG-phased-deploy-docs-tests"]
source_bindings:
  proposal: proposal.md
  design_source: design.md

risks:
  contract:
    applies: true
    evidence:
      - proposal.md P-001 将内置 versioned App 的 deploy 计划分为准备与统一激活阶段
      - CLI/plan 输出、发布历史和既有自定义 deploy/packageless App 是公共行为消费者
    required_checks:
      - 多 App/多机器 plan 展示准备屏障与激活阶段；packageless 和 custom deploy 语义不变
      - plan/history 新动作可序列化并可回放；旧快照继续解码
  data:
    applies: true
    evidence:
      - proposal.md P-002 统一激活 latest/版本标记；部分失败需要目标状态恢复
      - 发布快照和 rollback 依赖计划步骤 action、依赖与状态序列化
    required_checks:
      - stage 成功后 latest/标记不变；activate 成功后一致性不变
      - 激活失败、取消、旧版本、同版本跳过和 rollback 兼容路径有测试
  security:
    applies: true
    evidence:
      - 新远端脚本仍受固定 run 白名单与 workspace 读写沙箱约束
      - 包哈希、tar 成员、workspace 和 install_directory 的既有安全边界继续生效
    required_checks:
      - 新脚本不获得 net 权限，run 白名单最小化且固定 argv
      - 非法安装目录、版本名、包类型和路径逃逸失败关闭
  runtime:
    applies: true
    evidence:
      - proposal.md P-002 将上传/解包与 latest/重启分开；managed service 在激活阶段收敛
      - 部署窗口和失败恢复行为跨多目标变化
    required_checks:
      - 执行器测试证明所有 stage 完成前无 activate
      - 激活失败/取消/rollback 输出不伪报成功且目标 fail-fast/跨目标隔离语义明确
  ui:
    applies: false
    evidence: 本任务无图形界面；CLI plan/result 输出变化由文档与 CLI 测试覆盖。
    required_checks: []
  build:
    applies: false
    evidence: 不新增第三方依赖或构建面；新远端脚本是仓库内自包含 TypeScript。
    required_checks: []
  harness:
    applies: true
    evidence:
      - proposal.md P-003 要求 README/指南、CLI 输出、示例和测试同步
      - 高风险生命周期需要设计、实现、测试和验收证据链完整
    required_checks:
      - testplan.yaml 精确映射三个 change_id，unit/dv/integration 步骤可经统一入口运行
      - deno task check、lint、fmt、unit、dv、integration 和契约测试通过
