schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: breaking
  crate_root_export_change: true
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: ["src", "tests/unit", "tests/dv", "tests/integration", "README.md", "docs/guides", "skills/sfo-deploy-cluster/references/app.md", "skills/sfo-deploy-cluster/assets/app-config/app.yaml", "skills/sfo-deploy-cluster/assets/app-versioned/app.yaml", "examples/eleph-server-multipass/cluster-template/apps"]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: external-positive
      assertion: new-path-compiles
      name: App schema 1 公开类型消费编译
      change_ids: ["CHG-001", "CHG-002", "CHG-003"]
      run: ["deno", "check", "--frozen", "tests/contract/app_management_consumer.ts"]
    - id: C2
      kind: external-negative
      assertion: old-path-rejected-for-removed-symbol
      name: App schema 1 已移除 actions 类型拒收
      change_ids: ["CHG-001", "CHG-002", "CHG-003"]
      run: ["deno", "run", "--allow-read", "--allow-run", "tests/contract/verify_removed_app_management_api.ts"]
    - id: C3
      kind: removed-symbol-scan
      assertion: no-unallowlisted-old-symbol-references
      name: 旧 App 装载与配置路径闭包扫描
      change_ids: ["CHG-001", "CHG-002", "CHG-003"]
      run: ["uv", "run", "--active", "python", "./harness/scripts/consumer-closure-check.py", "--version", "v0.1", "--module", "sfo-deploy", "--task-name", "072-app-config-lifecycle"]
    - id: C4
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 仓库消费者编译闭包
      change_ids: ["CHG-001", "CHG-002", "CHG-003"]
      run: ["deno", "task", "check"]
    - id: C5
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: App 配置文档与示例契约
      change_ids: ["CHG-001", "CHG-002", "CHG-003"]
      run: ["deno", "run", "--frozen", "--allow-read", "tests/contract/verify_app_management_contract.ts"]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - "本环境没有真实 Ubuntu/CentOS 部署主机；systemctl/service 只通过固定 argv 和会话替身验证，不声称真实发行版服务成功。"
levels:
  unit:
    mode: enabled
    summary: 覆盖 App schema 1 装载、唯一性、服务归一、计划与历史编解码
    test_targets:
      - tests/unit/app_management_config.test.ts
      - tests/unit/config_planning.test.ts
      - tests/unit/service_management.test.ts
      - tests/unit/history.test.ts
      - tests/unit/history_regressions.test.ts
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["只使用本地临时目录和记录型传输替身。"]
    steps:
      - id: U1
        name: App 配置、服务与历史单元测试
        change_ids: ["CHG-001", "CHG-002", "CHG-003"]
        run: ["deno", "run", "-A", "tests/contract/run_app_lifecycle_tests.ts", "unit"]
  dv:
    mode: enabled
    summary: 覆盖配置执行、版本发布顺序、系统/脚本服务与失败恢复
    test_targets:
      - tests/dv/app_management_execution.test.ts
      - tests/dv/versioned_deploy_order.test.ts
      - tests/dv/execution.test.ts
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用本地临时目录和伪远端会话，不连接部署节点。"]
    steps:
      - id: D1
        name: App 生命周期执行测试
        change_ids: ["CHG-001", "CHG-002", "CHG-003"]
        run: ["deno", "run", "-A", "tests/contract/run_app_lifecycle_tests.ts", "dv"]
  integration:
    mode: enabled
    summary: 覆盖发布、配置指纹、传输安全与跨模块历史契约
    test_targets:
      - tests/integration/versioned_release.test.ts
      - tests/integration/versioned_transport_boundary.test.ts
      - tests/integration/managed_transport_security.test.ts
      - tests/integration/config_fingerprint.test.ts
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用本地临时目录和伪远端/OpenSSH 边界，不执行部署。"]
    steps:
      - id: I1
        name: 版本发布与安全集成测试
        change_ids: ["CHG-001", "CHG-002", "CHG-003"]
        run: ["deno", "run", "-A", "tests/contract/run_app_lifecycle_tests.ts", "integration"]
