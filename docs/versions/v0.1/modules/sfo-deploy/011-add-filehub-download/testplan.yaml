schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: ["README.md", "src/sfo_deploy", "tests"]
contract_checks:
  mode: enabled
  steps:
    - id: filehub-readme-provider-contract
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 验证 README 配置示例、默认 provider 与跨平台安装提示使用同一契约
      change_ids: ["CHG-filehub-download"]
      run: [
        ".venv/bin/python",
        "-m",
        "pytest",
        "-q",
        "tests/unit/test_filehub_downloads.py::TestFilehubContract::test_readme_and_default_provider_publish_one_consistent_contract",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - id: real-filehub-service-integration
    owner: sfo-deploy 发布负责人和具备隔离 filehub 测试服务的运维人员
    reason: 当前任务环境没有可安全使用的隔离 filehub 服务、临时账号和已发布测试版本，不能在不接触真实凭据或外部制品的前提下执行真实 pull
    acceptance_impact: 自动测试证明本地配置、进程、退出码、超时、工件与清理契约，但不能证明上游服务认证、授权、网络和版本内容在真实环境中的端到端可用性；发布前由 owner 在隔离服务执行一次成功 pull、一次认证失败和一次网络失败验收
levels:
  unit:
    mode: enabled
    summary: 在最低可暴露层用 fake Popen 执行 source 条件分支、命令边界、退出码、异常工件、超时/取消和清理分支
    test_targets: ["tests/unit/test_filehub_downloads.py::TestFilehubUnit"]
    preconditions:
      tools: []
      env: []
      services: []
      notes: ["不调用真实 filehub、网络或凭据；子进程输出以 DEVNULL 契约验证"]
    steps:
      - id: filehub-provider-unit
        name: 运行 filehub provider 分支、进程生命周期与安全诊断单元测试
        change_ids: ["CHG-filehub-download"]
        run: [
          ".venv/bin/python",
          "-m",
          "pytest",
          "-q",
          "tests/unit/test_filehub_downloads.py::TestFilehubUnit",
        ]
  dv:
    mode: enabled
    summary: 在单模块真实注册表与本地 HTTP 服务层验证 filehub 主流程、二次校验、现有 provider 兼容和失败清理
    test_targets: [
      "tests/unit/test_filehub_downloads.py::TestFilehubDv",
      "tests/unit/test_downloads.py",
    ]
    preconditions:
      tools: []
      env: []
      services: []
      notes: [
        "filehub 由 fake Popen 隔离；HTTP 回归只使用进程内 127.0.0.1 临时服务",
      ]
    steps:
      - id: filehub-registry-dv
        name: 运行默认注册、原子发布、框架二次校验及 HTTP/自定义 provider 回归
        change_ids: ["CHG-filehub-download"]
        run: [
          ".venv/bin/python",
          "-m",
          "pytest",
          "-q",
          "tests/unit/test_filehub_downloads.py::TestFilehubDv",
          "tests/unit/test_downloads.py",
        ]
  integration:
    mode: disabled
    summary: 真实 filehub 服务、网络与凭据的跨系统 pull 验证
    change_ids: ["CHG-filehub-download"]
    owner: sfo-deploy 发布负责人和具备隔离 filehub 测试服务的运维人员
    reason: 当前任务环境未提供隔离 filehub 服务、临时账号、测试版本和允许的外部网络凭据；禁止使用个人或生产凭据运行自动测试
