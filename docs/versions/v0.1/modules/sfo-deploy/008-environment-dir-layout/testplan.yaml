schema_version: 1
# 实现完成后生成的机器可读测试元数据。
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: breaking
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: true
# 绑定运行证据的生产代码、消费者、夹具、示例与设计文档。
evidence_inputs: [
  "src",
  "tests",
  "examples/eleph-server-multipass",
  "examples/eleph-server-multipass/src",
  "examples/eleph-server-multipass/tests",
  "examples/eleph-server-multipass/cluster-template",
  "README.md",
  "examples/eleph-server-multipass/README.md",
]
contract_checks:
  mode: enabled
  steps:
    - id: external-new-path
      kind: external-positive
      assertion: new-path-compiles
      name: 新布局消费者契约（示例生成集群装载与计划）
      change_ids: ["CHG-environment-dir-layout"]
      run: [
        ".venv/bin/python",
        "-m",
        "pytest",
        "-q",
        "examples/eleph-server-multipass/tests/test_config_contract.py",
      ]
    - id: external-old-path
      kind: external-negative
      assertion: old-path-rejected-for-removed-symbol
      name: 旧 machines.yaml 环境字段与旧环境定义目录被拒绝
      change_ids: ["CHG-environment-dir-layout"]
      run: [".venv/bin/python", "-m", "pytest", "-q", "tests/contract/test_old_layout_rejected.py"]
    - id: removed-symbol-scan
      kind: removed-symbol-scan
      assertion: no-unallowlisted-old-symbol-references
      name: 扫描仓库内残留的旧环境 key/布局引用
      change_ids: ["CHG-environment-dir-layout"]
      run: [
        "python",
        "./harness/scripts/consumer-closure-check.py",
        "--version",
        "v0.1",
        "--module",
        "sfo-deploy",
        "--task-name",
        "008-environment-dir-layout",
      ]
    - id: repository-compile-closure
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 编译仓库全部 Python 消费者
      change_ids: ["CHG-environment-dir-layout"]
      run: [
        ".venv/bin/python",
        "-m",
        "compileall",
        "-q",
        "src",
        "tests",
        "examples/eleph-server-multipass/src",
        "examples/eleph-server-multipass/tests",
      ]
    - id: documentation-examples
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: README 文档示例编译/导入契约
      change_ids: ["CHG-environment-dir-layout"]
      run: [
        ".venv/bin/python",
        "-m",
        "pytest",
        "-q",
        "tests/contract/test_public_contract.py::test_public_exports_and_readme_examples",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
levels:
  unit:
    mode: enabled
    summary: 配置装载、规划与示例环境脚本的单元级验证
    test_targets:
      - tests/unit
      - examples/eleph-server-multipass/tests/test_config_contract.py
      - examples/eleph-server-multipass/tests/test_plan.py
      - examples/eleph-server-multipass/tests/test_environment_scripts.py
      - examples/eleph-server-multipass/tests/test_lifecycle_scripts.py
    preconditions:
      tools: []
      env: []
      services: []
      notes: []
    steps:
      - id: unit-config-loading
        name: 根框架配置装载/规划/目录枚举单测
        change_ids: ["CHG-environment-dir-layout"]
        run: [".venv/bin/python", "-m", "pytest", "-q", "tests/unit"]
      - id: unit-example-layout-contract
        name: 示例新布局契约与依赖顺序
        change_ids: ["CHG-environment-dir-layout"]
        run: [
          ".venv/bin/python",
          "-m",
          "pytest",
          "-q",
          "examples/eleph-server-multipass/tests/test_config_contract.py",
          "examples/eleph-server-multipass/tests/test_plan.py",
        ]
      - id: unit-example-env-scripts
        name: 示例环境与生命周期脚本契约（新路径）
        change_ids: ["CHG-environment-dir-layout"]
        run: [
          ".venv/bin/python",
          "-m",
          "pytest",
          "-q",
          "examples/eleph-server-multipass/tests/test_environment_scripts.py",
          "examples/eleph-server-multipass/tests/test_lifecycle_scripts.py",
        ]
  dv:
    mode: enabled
    summary: 执行器生命周期主流程、配置变体与失败流程
    test_targets:
      - tests/dv
    preconditions:
      tools: []
      env: []
      services: []
      notes: []
    steps:
      - id: dv-execution-flows
        name: DV 执行器工作流（新夹具）
        change_ids: ["CHG-environment-dir-layout"]
        run: [".venv/bin/python", "-m", "pytest", "-q", "tests/dv"]
  integration:
    mode: enabled
    summary: 跨模块 CLI/远程运行与 prepare 信任包集成
    test_targets:
      - tests/integration
      - examples/eleph-server-multipass/tests/test_cli_contract.py
      - examples/eleph-server-multipass/tests/test_readme_contract.py
      - examples/eleph-server-multipass/tests/test_prepare_multipass_sh.py
      - examples/eleph-server-multipass/tests/test_artifact_contract.py
      - examples/eleph-server-multipass/tests/test_secrets.py
      - examples/eleph-server-multipass/tests/test_project_install.py
    preconditions:
      tools: []
      env: []
      services: []
      notes: []
    steps:
      - id: integration-root-runtime
        name: 根框架 CLI/远程运行集成
        change_ids: ["CHG-environment-dir-layout"]
        run: [".venv/bin/python", "-m", "pytest", "-q", "tests/integration"]
      - id: integration-example-cli
        name: 示例 CLI 与 README 契约
        change_ids: ["CHG-environment-dir-layout"]
        run: [
          ".venv/bin/python",
          "-m",
          "pytest",
          "-q",
          "examples/eleph-server-multipass/tests/test_cli_contract.py",
          "examples/eleph-server-multipass/tests/test_readme_contract.py",
        ]
      - id: integration-prepare-bundle
        name: prepare 信任包/制品/密钥/安装集成（屏蔽 pwsh 依赖用例）
        change_ids: ["CHG-environment-dir-layout"]
        run: [
          ".venv/bin/python",
          "-m",
          "pytest",
          "-q",
          "examples/eleph-server-multipass/tests/test_prepare_multipass_sh.py",
          "examples/eleph-server-multipass/tests/test_artifact_contract.py",
          "examples/eleph-server-multipass/tests/test_secrets.py",
          "examples/eleph-server-multipass/tests/test_project_install.py",
        ]
