schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: true
  build_surface_change: true
  documentation_examples_affected: true
evidence_inputs: ["src", "tests", "README.md", "docs/guides", "examples"]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: external-positive
      assertion: new-path-compiles
      name: 公共导出消费 app v4 类型与函数
      change_ids: [
        "CHG-unified-app-action-schema",
        "CHG-unified-app-action-consumers",
        "CHG-unified-app-action-docs-tests",
      ]
      run: ["deno", "check", "--frozen", "tests/contract/app_management_consumer.ts"]
    - id: C2
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: Deno 仓库编译与类型闭包
      change_ids: [
        "CHG-unified-app-action-schema",
        "CHG-unified-app-action-consumers",
        "CHG-unified-app-action-docs-tests",
      ]
      run: ["deno", "task", "check"]
    - id: C3
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: README/指南/nginx 示例使用 v4 契约
      change_ids: [
        "CHG-unified-app-action-schema",
        "CHG-unified-app-action-consumers",
        "CHG-unified-app-action-docs-tests",
      ]
      run: [
        "deno",
        "run",
        "--frozen",
        "--allow-read",
        "tests/contract/verify_app_management_contract.ts",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps: []
levels:
  unit:
    mode: enabled
    summary: 覆盖 v4 schema、路径解析、所有权冲突、unit 渲染和快照往返。
    test_targets: [
      "tests/unit/app_management_config.test.ts",
      "tests/unit/systemd_unit.test.ts",
      "tests/unit/history.test.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["离线临时目录夹具。"]
    steps:
      - id: U1
        name: v4 装载与动作所有权契约
        change_ids: ["CHG-unified-app-action-schema"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/app_management_config.test.ts",
        ]
      - id: U2
        name: systemd unit 渲染与安全字符边界
        change_ids: ["CHG-unified-app-action-schema", "CHG-unified-app-action-consumers"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/systemd_unit.test.ts",
        ]
      - id: U3
        name: 计划快照 service unitConfig 往返
        change_ids: ["CHG-unified-app-action-consumers"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/history.test.ts",
        ]
  dv:
    mode: enabled
    summary: 覆盖 unit 候选发布、daemon-reload/restart 与既有 managed 执行事务。
    test_targets: ["tests/dv/app_management_execution.test.ts", "tests/dv/execution.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用受控 fake transport。"]
    steps:
      - id: D1
        name: managed App/unit 执行与失败恢复
        change_ids: ["CHG-unified-app-action-schema", "CHG-unified-app-action-consumers"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/dv/app_management_execution.test.ts",
          "tests/dv/execution.test.ts",
        ]
  integration:
    mode: enabled
    summary: 覆盖示例集群、文档契约、传输协议和全量仓库回归。
    test_targets: ["tests/integration", "tests/contract/verify_app_management_contract.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["契约脚本只读仓库；集成测试自建临时目录。"]
    steps:
      - id: I1
        name: managed 传输与部署协议
        change_ids: ["CHG-unified-app-action-consumers"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/managed_transport_security.test.ts",
          "tests/integration/remote_deployment.test.ts",
        ]
      - id: I2
        name: 示例集群可装载与计划
        change_ids: ["CHG-unified-app-action-schema", "CHG-unified-app-action-docs-tests"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/environment_placement.test.ts",
        ]
      - id: I3
        name: 全量仓库回归
        change_ids: [
          "CHG-unified-app-action-schema",
          "CHG-unified-app-action-consumers",
          "CHG-unified-app-action-docs-tests",
        ]
        run: ["deno", "task", "test"]
      - id: I4
        name: lint 与格式闭包
        change_ids: ["CHG-unified-app-action-docs-tests"]
        run: ["deno", "task", "lint"]
