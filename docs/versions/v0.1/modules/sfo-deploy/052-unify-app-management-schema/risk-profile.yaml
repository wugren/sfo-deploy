schema_version: 1
task_manifest: task.yaml

change_ids: [
  "CHG-unified-app-action-schema",
  "CHG-unified-app-action-consumers",
  "CHG-unified-app-action-docs-tests",
]
source_bindings:
  proposal: proposal.md
  design_source: design.md

risks:
  contract:
    applies: true
    evidence:
      - proposal.md P-001 新增 app.yaml schema v4 的 management.actions 公开契约，并收窄为 config/service 两类资源。
      - proposal.md P-001/P-002 service 条目新增 working_directory 和固定启动命令/参数的 unit_config 语义。
      - README、集群配置指南和示例集群是配置契约的直接消费者。
    required_checks:
      - v4 schema 只接受 config/service；旧 scripts、configs、service、hooks 别名和未知 kind 定向拒收。
      - service unit_config 的 working_directory、固定命令/参数、unit target、路径冲突和越界路径有正负例校验。
      - README、指南、示例与 loader 错误文案一致。
  data:
    applies: true
    evidence:
      - proposal.md P-002 改变计划/历史快照中的 managed service 表示；回滚需要继续 decode 现有发布快照。
      - src/history.ts 是计划/发布快照编解码与回滚消费者。
    required_checks:
      - v4 新计划/快照 encode/decode 往返保留 config、service、working_directory、固定启动命令和参数。
      - 旧 v4 快照 decode 行为明确并有回归证据，回滚路径不因新形状失败。
  security:
    applies: true
    evidence:
      - proposal.md P-002 unit 文件由框架特权发布，可执行路径与 working_directory 影响目标主机执行边界。
      - 相对路径越界、命令注入、参数分隔符和权限边界必须失败关闭。
    required_checks:
      - working_directory 越界、非法 unit target、非法命令/参数、目标路径冲突均失败且不发布。
      - unit 文件权限、owner/group 和原子发布边界有测试。
  runtime:
    applies: true
    evidence:
      - proposal.md P-002 unit 生成与发布必须在服务收敛前执行，内容变化要触发 daemon-reload/服务动作。
      - src/execution.ts、src/transport.ts、src/service_management.ts 是部署、发布、锁和 systemd 收敛运行面。
    required_checks:
      - unit 渲染/发布顺序、daemon-reload、服务收敛、unchanged 跳过和失败恢复回归通过。
      - deploy/configure/start/stop/restart 的锁和 release attempt 语义保持不变。
  ui:
    applies: false
    evidence: 本任务没有图形界面；CLI 只同步计划/错误展示，行为由 contract 与相关测试覆盖。
    required_checks: []
  build:
    applies: true
    evidence:
      - 公开类型、配置装载、部署包与远端协议变化需要 Deno 编译/类型闭包验证。
      - deno task check 是当前仓库统一构建/类型/文档闭包信号。
    required_checks:
      - deno task check 通过，相关 bundle/构建产物无未提交差异。
  harness:
    applies: true
    evidence:
      - proposal.md P-003 要求文档、示例和测试同步；testplan 必须映射三个 change_id 和风险检查。
      - harness/scripts/test-run.py 是统一测试入口。
    required_checks:
      - testplan.yaml 映射全部 change_id 与 required_checks，步骤可经 sfo-deploy/052-unify-app-management-schema all 到达。
      - 相关 unit/integration/dv/contract 测试与 deno task check 通过并生成机器制品。
