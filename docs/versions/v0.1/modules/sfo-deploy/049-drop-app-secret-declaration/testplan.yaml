schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: breaking
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: ["src", "tests", "README.md", "docs/guides/sfo-deploy-cluster-configuration.md"]
contract_checks:
  mode: enabled
  steps:
    - id: new-path-load-accepts
      kind: external-positive
      assertion: new-path-compiles
      name: 新路径编译并端到端：v3 managed 绑定直连 cluster.yaml.secrets 装载成功
      change_ids: [
        "CHG-cluster-secret-bindings",
        "CHG-secret-delivery-planning",
        "CHG-secret-docs-tests",
      ]
      run: [
        "deno",
        "test",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/unit/app_management_config.test.ts",
      ]
    - id: old-path-load-rejected
      kind: external-negative
      assertion: old-path-rejected-for-removed-symbol
      name: 旧路径拒收：app.yaml/环境定义顶层 secret_values/secret_files 装载即定向报错
      change_ids: [
        "CHG-cluster-secret-bindings",
        "CHG-secret-delivery-planning",
        "CHG-secret-docs-tests",
      ]
      run: [
        "deno",
        "test",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/unit/secrets_deploy_config.test.ts",
      ]
    - id: removed-symbol-scan
      kind: removed-symbol-scan
      assertion: no-unallowlisted-old-symbol-references
      name: 已删除顶层秘密声明符号仓库级消费者扫描
      change_ids: [
        "CHG-cluster-secret-bindings",
        "CHG-secret-delivery-planning",
        "CHG-secret-docs-tests",
      ]
      run: [
        "python3",
        "harness/scripts/consumer-closure-check.py",
        "--root",
        ".",
        "--version",
        "v0.1",
        "--module",
        "sfo-deploy",
        "--task-name",
        "049-drop-app-secret-declaration",
      ]
    - id: repository-compile-closure
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 生产入口类型检查闭包（deno task check，ScriptDefinition 收窄后全仓编译）
      change_ids: [
        "CHG-cluster-secret-bindings",
        "CHG-secret-delivery-planning",
        "CHG-secret-docs-tests",
      ]
      run: ["deno", "task", "check"]
    - id: documentation-examples
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 文档/示例契约：README 与指南收敛为 cluster.yaml.secrets 唯一声明点模型
      change_ids: [
        "CHG-cluster-secret-bindings",
        "CHG-secret-delivery-planning",
        "CHG-secret-docs-tests",
      ]
      run: [
        "deno",
        "test",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/contract/verify_app_management_contract.ts",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps: []
levels:
  unit:
    mode: enabled
    summary: 覆盖顶层声明定向拒收（app.yaml 与环境定义）、managed 绑定直连 cluster 校验正负例、机器范围秘密集合推导、history 不变量与快照往返、CLI 计划序列化回归。
    test_targets: [
      "tests/unit/app_management_config.test.ts",
      "tests/unit/secrets_deploy_config.test.ts",
      "tests/unit/config_planning.test.ts",
      "tests/unit/cli_human_output.test.ts",
      "tests/unit/environment_placement.test.ts",
      "tests/unit/history.test.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["全部用例离线运行，仅使用临时目录夹具。"]
    steps:
      - id: U1
        name: v3 managed 装载回归：绑定直连 cluster.yaml.secrets、未知秘密/未放置本机失败关闭
        change_ids: ["CHG-cluster-secret-bindings"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/app_management_config.test.ts",
        ]
      - id: U2
        name: 顶层 secret_values/secret_files 定向拒收（app.yaml 与环境定义）与 cluster 放置/机器范围集合推导
        change_ids: ["CHG-cluster-secret-bindings", "CHG-secret-delivery-planning"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/secrets_deploy_config.test.ts",
        ]
      - id: U3
        name: 环境实例放置与计划秘密集合、CLI 计划序列化回归
        change_ids: ["CHG-secret-delivery-planning"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/environment_placement.test.ts",
          "tests/unit/config_planning.test.ts",
          "tests/unit/cli_human_output.test.ts",
        ]
      - id: U4
        name: history 快照 encode/decode 往返与 managed secret/lifecycle 秘密不变量
        change_ids: ["CHG-secret-delivery-planning"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/history.test.ts",
        ]
  dv:
    mode: disabled
    reason: 本任务为装载校验与计划集合推导的确定性分支，不涉及 deno dv 执行、内存传输或生命周期工作流，无 DV 断言可登记。
  integration:
    mode: enabled
    summary: 通过集成测试验证方案 A 秘密交付路径与历史发布回归，并经契约脚本验证指南/README 的唯一声明点表述与旧符号删除扫描。
    test_targets: [
      "tests/integration/",
      "tests/contract/verify_app_management_contract.ts",
      "tests/contract/verify_secrets_contract.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: [
        "契约脚本只读仓库文档与源码；集成测试自建临时集群与秘密目录。",
      ]
    steps:
      - id: I1
        name: 集成回归：secrets-deploy 放置、loader 按步骤集合装载与发布历史流程
        change_ids: ["CHG-secret-delivery-planning"]
        run: ["deno", "task", "test"]
      - id: I2
        name: 契约：指南/README 唯一声明点表述、managed 绑定与 template/script updater 文档边界
        change_ids: ["CHG-secret-docs-tests"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/contract/verify_app_management_contract.ts",
        ]
      - id: I3
        name: 契约：已删除秘密符号仓库级扫描（config_secrets/file_secrets/上下文文件机制）
        change_ids: ["CHG-secret-docs-tests"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/contract/verify_secrets_contract.ts",
        ]
