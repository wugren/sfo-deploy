schema_version: 1
task_manifest: task.yaml

# `risk-profile-check.py --prepare --task <packet>/task.yaml` machine-writes the
# task/change and active-source bindings below. Proposal owns applies/evidence;
# design owns required_checks for applicable categories.
change_ids: ["CHG-cluster-secret-bindings", "CHG-secret-delivery-planning", "CHG-secret-docs-tests"]
source_bindings:
  proposal: proposal.md
  design_source: design.md

risks:
  contract:
    applies: true
    evidence:
      - proposal.md 的 P-001 删除 app.yaml 与环境定义顶层 secret_values/secret_files 声明契约及 declaredManagedSecret 门禁，v3 合法字段集收窄（破坏性），managed 绑定改为直连 cluster.yaml.secrets 校验
      - proposal.md 的 P-002 改变步骤秘密集合与 loader 交付推导语义（已确认方案 A：机器范围），plan 快照字段形状不变
      - src/config.ts 是唯一配置装载实现，src/planning.ts 是计划秘密集合推导实现，README.md 与 docs/guides/sfo-deploy-cluster-configuration.md 是契约文档消费者
    required_checks:
      - 含顶层 secret_values/secret_files 的 v3 app.yaml 与环境定义装载即报定向迁移错误（指明「直接引用 cluster.yaml.secrets 声明」）；其余 v2/v3 装载结果回归逐字段不变
      - managed 绑定（yaml/json/toml/ini/template 与 script updater secrets）直连 cluster 校验正负例：未知秘密、kind 冲突、未放置本机均装载期失败关闭且错误文案符合设计
      - 步骤秘密集合按方案 A 机器范围推导逐字段可复核（含 machines: "*" 归一与 lifecycle/普通脚本门禁）；README 与指南收敛为「cluster.yaml.secrets 唯一声明点 + 绑定直接引用」模型且 contract 校验覆盖
  data:
    applies: true
    evidence:
      - proposal.md 的 P-002 改变 plan 步骤 secret_values/secret_files/lifecycle_* 的推导来源；快照 encode/decode 格式与历史记录兼容面必须保持
      - src/history.ts 对步骤秘密集合与 managed secret 不变量有显式校验，是持久发布历史的持久化消费点
    required_checks:
      - plan 快照 encode/decode 往返逐字段一致；既有快照解码回归不变
      - history 校验不变量（managed secret ∈ 步骤秘密集合、lifecycle 秘密 ⊆ 步骤集合）在方案 A 推导下对全部 managed 形态成立
  security:
    applies: true
    evidence:
      - 已确认方案 A 使脚本 loader 可见面变为机器范围：同机多 App 共享本机秘密可见性，最小交付边界由 cluster.yaml 的 machines 放置声明承担（用户知情确认的取舍）
      - 绑定引用侧保持失败关闭：未声明、kind 冲突、未放置本机均在装载期拒绝；远端协议与 048 template 失败关闭行为不变
    required_checks:
      - 绑定引用全部负例（未知秘密/kind 冲突/未放置本机）装载期失败关闭；template 仅值秘密约束保持
      - loader 名单装载与秘密放置（secrets-deploy）路径回归不变；错误信息不含秘密值
  runtime:
    applies: true
    evidence:
      - proposal.md 的 P-002 改变步骤交付的秘密集合（机器范围推导），远端执行器按步骤集合装载 loader 名单与放置文件，交付面变化需回归证据
    required_checks:
      - dv/integration 执行路径在方案 A 秘密集合下回归：secrets-deploy 放置、loader 按 step 集合装载、无秘密值进入日志或错误信息
  ui:
    applies: false
    evidence: 本任务没有图形界面、导航、前端状态或无障碍表面；CLI 计划序列化字段形状不变（仅推导来源变化），行为断言归 contract/harness 检查。
    required_checks: []
  build:
    applies: false
    evidence: 不新增第三方依赖、不改交付产物与 bundle；ScriptDefinition 公开类型收窄由 `deno task check`（contract repository-compile-closure）覆盖。
    required_checks: []
  harness:
    applies: true
    evidence:
      - proposal.md 的 P-003 要求夹具/用例改写与文档收敛，并保持 `deno task check` 全绿
      - design.md 的 Directly Mapped Change Items 将测试实现、testplan.yaml、runner 注册限定为本任务的测试责任
      - harness/scripts/test-run.py 是任务注册消费者，不改变 Harness 规则或其他任务语义
    required_checks:
      - testplan.yaml 精确映射三个 change_id 与适用风险 required_checks，步骤可从 sfo-deploy/049-drop-app-secret-declaration all 到达
      - runner list 只新增本任务 scope 且既有 scope/命令保持不变，成功运行写出覆盖本任务 testplan 和三个 change_id 的机器制品
      - unit/integration/contract 新增用例覆盖直连 cluster 正负例与方案 A 集合推导；`deno task check` 全绿
