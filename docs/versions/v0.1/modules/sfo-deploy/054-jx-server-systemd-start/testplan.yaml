schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: true
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: ["src", "tests", "examples", "README.md", "docs/guides"]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: external-positive
      assertion: new-path-compiles
      name: 公共消费者编译 deployment 类型
      change_ids: [
        "CHG-versioned-deployment-schema",
        "CHG-versioned-deployment-execution",
        "CHG-packaged-app-versioned-migration",
        "CHG-versioned-deployment-docs-tests",
      ]
      run: ["deno", "check", "--frozen", "tests/contract/app_management_consumer.ts"]
    - id: C2
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: README/指南/Multipass 示例契约
      change_ids: [
        "CHG-versioned-deployment-schema",
        "CHG-versioned-deployment-execution",
        "CHG-packaged-app-versioned-migration",
        "CHG-versioned-deployment-docs-tests",
      ]
      run: [
        "deno",
        "run",
        "--frozen",
        "--allow-read",
        "tests/contract/verify_app_management_contract.ts",
      ]
    - id: C3
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 仓库与远端脚本编译闭包
      change_ids: [
        "CHG-versioned-deployment-schema",
        "CHG-versioned-deployment-execution",
        "CHG-packaged-app-versioned-migration",
        "CHG-versioned-deployment-docs-tests",
      ]
      run: [
        "deno",
        "run",
        "--frozen",
        "--allow-read",
        "--allow-write",
        "--allow-run=deno",
        "--allow-env",
        "tests/contract/verify_independent_remote_scripts.ts",
        "closure",
      ]
    - id: C4
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 独立脚本与文档示例契约
      change_ids: [
        "CHG-versioned-deployment-schema",
        "CHG-versioned-deployment-execution",
        "CHG-packaged-app-versioned-migration",
        "CHG-versioned-deployment-docs-tests",
      ]
      run: [
        "deno",
        "run",
        "--frozen",
        "--allow-read",
        "--allow-write",
        "--allow-run=deno",
        "--allow-env",
        "tests/contract/verify_independent_remote_scripts.ts",
        "docs",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps: []
levels:
  unit:
    mode: enabled
    summary: 覆盖 deployment 装载/默认/冲突、计划注入、秘密最小化和快照往返。
    test_targets: [
      "tests/unit/app_management_config.test.ts",
      "tests/unit/history.test.ts",
      "tests/unit/history_regressions.test.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["离线临时目录夹具。"]
    steps:
      - id: U1
        name: v4 deployment 装载与计划契约
        change_ids: ["CHG-versioned-deployment-schema"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/app_management_config.test.ts",
        ]
      - id: U2
        name: deployment 快照与旧计划兼容
        change_ids: ["CHG-versioned-deployment-schema", "CHG-versioned-deployment-execution"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/history.test.ts",
          "tests/unit/history_regressions.test.ts",
        ]
  dv:
    mode: enabled
    summary: 覆盖 managed 发布顺序、服务收敛、失败恢复和执行器隔离。
    test_targets: ["tests/dv/app_management_execution.test.ts", "tests/dv/execution.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用受控 fake transport。"]
    steps:
      - id: D1
        name: managed App/执行器回归
        change_ids: [
          "CHG-versioned-deployment-schema",
          "CHG-versioned-deployment-execution",
          "CHG-packaged-app-versioned-migration",
        ]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/dv/app_management_execution.test.ts",
          "tests/dv/execution.test.ts",
        ]
  integration:
    mode: enabled
    summary: 覆盖内置发布算法、示例配置、文档契约和 lint/格式闭包。
    test_targets: [
      "tests/integration/versioned_release.test.ts",
      "tests/integration/environment_placement.test.ts",
      "tests/contract/verify_app_management_contract.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["契约脚本只读仓库；发布脚本测试自建临时目录。"]
    steps:
      - id: I1
        name: 内置 versioned release 行为
        change_ids: ["CHG-versioned-deployment-execution", "CHG-packaged-app-versioned-migration"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/versioned_release.test.ts",
        ]
      - id: I2
        name: 示例集群装载/计划与文档
        change_ids: [
          "CHG-versioned-deployment-schema",
          "CHG-packaged-app-versioned-migration",
          "CHG-versioned-deployment-docs-tests",
        ]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/environment_placement.test.ts",
        ]
      - id: I3
        name: lint 与格式闭包
        change_ids: ["CHG-versioned-deployment-docs-tests"]
        run: ["deno", "task", "lint"]
