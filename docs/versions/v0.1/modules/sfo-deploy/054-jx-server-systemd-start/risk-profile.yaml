schema_version: 1
task_manifest: task.yaml

change_ids: [
  "CHG-versioned-deployment-schema",
  "CHG-versioned-deployment-execution",
  "CHG-packaged-app-versioned-migration",
  "CHG-versioned-deployment-docs-tests",
]
source_bindings:
  proposal: proposal.md
  design_source: design.md

risks:
  contract:
    applies: true
    evidence:
      - proposal.md P-001 为 App v4 新增可选 deployment.kind，且带包 App 无 scripts.deploy 时默认内置发布；自定义 deploy 保留
      - proposal.md P-003 将 jx-server/jx-web 迁移到统一 `<install_directory>/<version>` 与 `<install_directory>/latest` 布局
      - README、配置指南与既有 app-management/deploy 契约是公共行为消费者
    required_checks:
      - app.yaml v4 deployment.kind 正负例、deployment 与 scripts.deploy 冲突、packageless 冲突和 management.run_as 缺失失败关闭
      - jx-server/jx-web template 与 live 配置一致，plan 展示内置发布；jx-server 同时展示 service unit_config
  data:
    applies: true
    evidence:
      - proposal.md P-002 将版本标记、latest 原子切换、同版本跳过、旧版本清理和失败回滚提升为框架内置职责
      - 发布历史快照和 rollback 依赖 plan step 序列化；新增 deployment 字段必须保持旧快照可解码
    required_checks:
      - plan/history round-trip 保留 deployment；旧 plan-v1/v2/v3 与旧 v4 快照继续解码
      - 同版本跳过、新版本发布、latest/版本标记回滚、清理边界和取消路径有可运行验证
  security:
    applies: true
    evidence:
      - 内置远端脚本只获得固定 run 白名单和 workspace 读/写权限；安装目录由框架固定 install/chown 原语准备
      - 安装包继续由既有 provider、SHA-256 和安全解包通道校验；脚本不处理秘密
    required_checks:
      - 内置脚本权限是最小 run 白名单且不声明 net；危险 install 目录、版本名和包类型失败关闭
      - 现有 managed App 身份校验、包安全解包和 managed 配置秘密边界回归通过
  runtime:
    applies: true
    evidence:
      - proposal.md P-002 改变 deploy 执行路径；managed service 仍需在发布成功后收敛
      - jx-server 与 jx-web 的生命周期从用户脚本切换到框架内置脚本
    required_checks:
      - dv/integration 覆盖内置发布、服务收敛顺序、custom deploy 兼容和执行失败恢复
      - CLI plan/result 输出与实际步骤一致
  ui:
    applies: false
    evidence: 本任务无图形界面或导航工作流；CLI 输出变化由 contract/result 测试覆盖。
    required_checks: []
  build:
    applies: false
    evidence: 不新增第三方依赖、不改 deno.lock；新增远端脚本是仓库内自包含 TypeScript，由现有 bundle/执行链路消费。
    required_checks: []
  harness:
    applies: true
    evidence:
      - proposal.md P-004 要求 README/配置指南、测试和统一测试入口同步
      - 高风险生命周期要求 design/implementation/testing/acceptance 工件链完整
    required_checks:
      - testplan.yaml 精确映射四个 change_id；unit/dv/integration 步骤可经 harness/scripts/test-run.py 执行
      - deno task check、lint、fmt、unit、dv、integration 和 contract/编译闭包通过
