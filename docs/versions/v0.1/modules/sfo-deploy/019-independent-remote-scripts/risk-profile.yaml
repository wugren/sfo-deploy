schema_version: 1
task_manifest: task.yaml

change_ids: ["CHG-independent-remote-scripts"]
source_bindings:
  proposal: proposal.md
  design_source: pipeline/plan.md

risks:
  contract:
    applies: true
    evidence:
      - proposal.md 的 P-001、P-002 与兼容性边界要求远端不再获得框架源码，现有脚本迁移为独立程序
      - pipeline/plan.md 的 Exported Interfaces、Consumer Migration Closure 与 Failure Flows 固化普通 JSON 协议及旧脚本迁移路径
    required_checks:
      - 独立脚本在无 sfo_deploy.ts 的隔离工作区执行成功
      - 仓库当前脚本和文档不存在框架运行库导入
      - 记录旧导入路径与历史快照的兼容性结论
  data:
    applies: true
    evidence:
      - proposal.md 的安全边界要求 context JSON 继续只携带当前步骤声明的数据和 configure 密钥
      - pipeline/plan.md 的 State Ownership 与 Invariants to Preserve 固化 schema v1、0600 权限、最小暴露与清理语义
    required_checks:
      - context JSON schema 与秘密选择保持稳定
      - 非 configure 步骤不获得配置密钥或模板
      - 临时上下文和本地准备目录在成功失败路径均清理
  security:
    applies: true
    evidence:
      - proposal.md 的安全要求规定移除辅助模块后仍保持 Deno 最小权限与秘密脱敏
      - pipeline/plan.md 的 Failure Flows 与 Invariants to Preserve 固化 allowlist、deny-ffi、no-remote/no-npm 和工作区边界
    required_checks:
      - Deno 固定权限参数不放宽且仅允许 DEPLOYMENT_CONTEXT_PATH
      - 日志脱敏和文件私钥投递行为回归通过
      - 远端工作区不含未声明框架源码
  runtime:
    applies: true
    evidence:
      - proposal.md 的 Scope 要求删除辅助源码准备与上传，同时保持现有脚本执行、失败和清理语义
      - pipeline/plan.md 的 Key Call Flow、State Ownership 与 Failure Flows 固化上传顺序、执行、取消和资源生命周期
    required_checks:
      - DV 覆盖执行顺序、单目标 fail-fast、跨目标隔离、取消和清理
      - 运行时预检仍在每台机器复用且脚本逐项执行
      - framework-runtime 上传事件不存在
  build:
    applies: true
    evidence:
      - proposal.md 的 P-001、P-002 要求删除 src/remote_runtime.ts 并迁移所有仓库消费者
      - pipeline/plan.md 的 API and Build Surface Impact、Consumer Migration Closure 与 File-Level Implementation Sequence 固化发布源码集合及编译闭包
    required_checks:
      - deno check 覆盖公共入口、测试与示例入口
      - 公共导出和仓库消费者闭合扫描通过
      - 任务级统一测试入口成功
  ui:
    applies: false
    evidence: 无 UI、导航、可访问性或本地化交互变化；仅更新中文 CLI/指南说明。
    required_checks: []
  harness:
    applies: false
    evidence: 不修改 Harness 规则、检查器或统一测试框架，只新增本任务的正常流水线绑定与测试注册。
    required_checks: []
