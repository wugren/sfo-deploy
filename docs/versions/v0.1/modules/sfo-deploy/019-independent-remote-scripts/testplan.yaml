schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: breaking
  crate_root_export_change: false
  build_surface_change: true
  documentation_examples_affected: true
evidence_inputs: ["src", "tests", "examples/eleph-server-multipass", "README.md", "docs/guides"]
contract_checks:
  mode: enabled
  steps:
    - id: independent-external-positive
      kind: external-positive
      assertion: new-path-compiles
      name: 编译仅使用当前 PreparedExecution 和 PreparedStep 字段的外部消费者
      change_ids: ["CHG-independent-remote-scripts"]
      run: ["deno", "check", "--frozen", "tests/contract/independent_remote_consumer.ts"]
    - id: independent-external-negative
      kind: external-negative
      assertion: old-path-rejected-for-removed-symbol
      name: 由成功包装器验证两个已删除的远端运行库字段均被编译器拒绝
      change_ids: ["CHG-independent-remote-scripts"]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-write",
        "--allow-run=deno",
        "tests/contract/verify_independent_remote_scripts.ts",
        "negative",
      ]
    - id: independent-removed-symbol-scan
      kind: removed-symbol-scan
      assertion: no-unallowlisted-old-symbol-references
      name: 扫描生产、测试、示例与文档消费者中的旧远端框架符号
      change_ids: ["CHG-independent-remote-scripts"]
      run: [
        "python",
        "harness/scripts/consumer-closure-check.py",
        "--root",
        ".",
        "--version",
        "v0.1",
        "--module",
        "sfo-deploy",
        "--task-name",
        "019-independent-remote-scripts",
      ]
    - id: independent-repository-compile-closure
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 编译公共源码、仓库测试、示例入口以及模板和实际集群共四十二个生命周期脚本
      change_ids: ["CHG-independent-remote-scripts"]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-run=deno",
        "tests/contract/verify_independent_remote_scripts.ts",
        "closure",
      ]
    - id: independent-documentation-examples
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 验证独立脚本文档、迁移说明并离线编译模板和实际集群的全部生命周期脚本
      change_ids: ["CHG-independent-remote-scripts"]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-run=deno",
        "tests/contract/verify_independent_remote_scripts.ts",
        "docs",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - id: real-ssh-service-deployment
    owner: sfo-deploy 发布负责人和具备隔离目标机的运维人员
    reason: 当前环境没有可安全修改的隔离 SSH 目标机、sudo、systemd、MySQL、Redis 和发布制品，不能执行破坏性的真实服务部署
    acceptance_impact: 自动测试以真实准备器和记录型传输证明非空秘密、模板、包、file-secret、上传顺序、有效 mode、失败传播和清理，并以 OpenSSH 命令替身锁定默认 chmod 0600；仍不能证明特定 Linux 发行版上的服务命令和回退效果
  - id: exhaustive-operating-system-script-branches
    owner: sfo-deploy 示例维护者
    reason: 模板和实际集群各二十一个脚本逐相对路径保持一致且共四十二个文件全部由编译器闭合；真实 Deno 子进程直接覆盖 context、模板、包、秘密和 action 的正常、边界与错误输入，但安装、服务健康等待、数据库迁移及回退分支需要隔离 VM 才能无副作用执行
    acceptance_impact: 独立输入协议和零框架依赖有自动证据，操作系统工具的全部退出组合仍需发布前环境验收
  - id: concurrency-not-applicable
    owner: sfo-deploy 维护者
    reason: 设计将同一计划的步骤顺序执行，任务图也按依赖串行；实现没有新增共享并发或可重入状态
    acceptance_impact: DV 覆盖跨目标失败隔离和取消顺序，不存在需要新增竞态用例的并发设计元素
levels:
  unit:
    mode: enabled
    summary: 在最低层回归上下文秘密脱敏、稳定输入、Deno 权限参数和 OpenSSH uploadFile 默认远端 chmod 0600
    test_targets: ["tests/unit/downloads_secrets.test.ts", "tests/unit/transport_cli.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: [
        "只使用临时文件、可控命令替身和本地回环资源；覆盖秘密不进入日志、固定 Deno 沙箱参数及 uploadFile 未指定 mode 时实际发出 chmod 0600",
      ]
    steps:
      - id: independent-protocol-unit
        name: 运行秘密、稳定输入、默认 0600、传输权限与清理分支单元测试
        change_ids: ["CHG-independent-remote-scripts"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/downloads_secrets.test.ts",
          "tests/unit/transport_cli.test.ts",
        ]
  dv:
    mode: enabled
    summary: 以真实 prepareExecution 和记录型传输验证非空 config secret、模板、包、file-secret 的装配与严格上传顺序，并覆盖只上传声明脚本、复用预检、失败隔离、取消及本地和远端清理
    test_targets: ["tests/dv/execution.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: [
        "不连接真实 SSH；记录型传输读取真实准备器生成的 context 和暂存 file secret，记录模板、context、脚本、包、file-secret、execute、remove、workspace cleanup、session close 事件；接口 effective mode 与 OpenSSH unit 的实际 chmod 0600 共同证明权限约定",
      ]
    steps:
      - id: independent-execution-dv
        name: 运行非空独立输入桥接、上传失败清理及零框架运行库执行生命周期 DV
        change_ids: ["CHG-independent-remote-scripts"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run=ssh,scp,filehub,deno",
          "tests/dv/execution.test.ts",
        ]
  integration:
    mode: enabled
    summary: 用隔离真实 Deno 子进程验证自包含脚本解析 schema v1 普通 JSON 并处理模板、秘密、包、action 及非法输入
    test_targets: ["tests/integration/independent_remote_scripts.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: [
        "脚本副本只读写任务临时目录；唯一成功的配置流程把硬编码工作目录替换为临时路径，其余系统命令边界通过权限拒绝证明输入解析已完成",
      ]
    steps:
      - id: independent-scripts-integration
        name: 运行独立脚本普通 JSON 输入、模板、秘密、包和动作契约集成测试
        change_ids: ["CHG-independent-remote-scripts"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-run=deno",
          "tests/integration/independent_remote_scripts.test.ts",
        ]
