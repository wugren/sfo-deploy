schema_version: 1
task_manifest: task.yaml

change_ids: ["CHG-deno-script-contract", "CHG-deno-example-migration"]
source_bindings:
  proposal: proposal.md
  design_source:

risks:
  contract:
    applies: true
    evidence: 集群 YAML 的机器运行时、脚本声明、RemoteSession 协议和发布计划快照均改变；新配置迁移到 Deno，但 v1 Python 快照必须继续解码和回退。
    required_checks:
      - 新 `.ts` 脚本对象配置通过且 `.py`、未知权限和非法白名单失败关闭
      - 新 Deno 与多 IP 计划以 v3 往返一致，且既有 v1 Python、v2 Deno 与 v3 快照分别严格解码执行
  data:
    applies: true
    evidence: 发布历史会保存脚本运行时、解释器和权限白名单；现有不可变快照 schema 需要向后兼容读取。
    required_checks:
      - v3 计划 codec 保留 Deno runtime、权限字段和有序多 IP 数组，并拒绝未知、缺失、逃逸或篡改内容
      - v1 Python 与既有 v2 Deno 快照保持不可变且可读取回退，v2 派生的新 attempt 可写 v3 但不得改写来源快照
  security:
    applies: true
    evidence: Deno 直接文件、网络、环境、子进程和 FFI 权限构成新的信任边界；秘密上下文仍需最小暴露、脱敏和可靠清理。
    required_checks:
      - Deno 只允许直接读写当前步骤工作目录且默认网络、FFI 和未声明子进程被拒绝
      - 显式 net/run 白名单按单脚本生效且不能通过配置路径或标识符注入 CLI 参数
      - 配置秘密只提供给声明的 configure 脚本并在输出与清理路径保持现有保护
  runtime:
    applies: true
    evidence: 远端预检、逐步骤工作区、脚本执行、特权前缀、失败分类和清理生命周期从 Python 改为 Deno，同时保留旧 Python 回退运行路径。
    required_checks:
      - 每个步骤独立创建并在成功、脚本失败、预检失败和取消路径清理工作目录
      - Deno 缺失或版本不兼容在用户脚本前以 preflight 失败，跨目标隔离和目标内 fail-fast 不变
      - 白名单子进程、本机网络授权和旧 Python 回退分别走正确执行路径
  build:
    applies: true
    evidence: 目标机依赖从新配置所需 Python 3 改为 Deno，示例集群和文档检查链迁移为 TypeScript，并影响部署与回退兼容面。
    required_checks:
      - 固定并验证最低 Deno 2 版本且文档、示例和预检一致
      - 所有示例 TypeScript 脚本通过离线 Deno check，仓库不再声明新集群需要远端 Python
      - 配置、示例和发布回退迁移边界有可重复验证
  ui:
    applies: false
    evidence: 该任务没有 UI、导航、可访问性、本地化或交互流程变化。
    required_checks: []
  harness:
    applies: false
    evidence: 任务只消费既有 Harness 自动流水线和任务级测试入口，不修改 Harness 规则、检查器或流程语义。
    required_checks: []
