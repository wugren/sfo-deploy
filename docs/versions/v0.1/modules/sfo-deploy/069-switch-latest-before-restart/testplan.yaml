schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: ["src", "tests", "README.md", "docs/guides"]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: external-positive
      assertion: new-path-compiles
      name: 公开接口消费编译
      change_ids: ["CHG-configure-before-switch"]
      run: ["deno", "check", "--frozen", "tests/contract/app_management_consumer.ts"]
    - id: C2
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 仓库类型闭包
      change_ids: ["CHG-configure-before-switch"]
      run: ["deno", "task", "check"]
    - id: C3
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 框架文档契约
      change_ids: ["CHG-configure-before-switch"]
      run: ["deno", "run", "--frozen", "--allow-read", "tests/contract/verify_app_management_contract.ts"]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps: []
levels:
  unit:
    mode: enabled
    summary: 验证部署准备屏障、提交顺序、补偿及相关回归
    test_targets: ["tests/unit/app_management_config.test.ts", "tests/unit/service_management.test.ts", "tests/unit/history.test.ts", "tests/unit/history_regressions.test.ts", "tests/unit/versioned_release_management.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用本地临时目录和记录型传输；不执行远端部署。"]
    steps:
      - id: U1
        name: 部署事务相关测试
        change_ids: ["CHG-configure-before-switch"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/unit/app_management_config.test.ts", "tests/unit/service_management.test.ts", "tests/unit/history.test.ts", "tests/unit/history_regressions.test.ts", "tests/unit/versioned_release_management.test.ts"]
  dv:
    mode: enabled
    summary: 验证部署准备屏障、提交顺序、补偿及相关回归
    test_targets: ["tests/dv/execution.test.ts", "tests/dv/app_management_execution.test.ts", "tests/dv/versioned_deploy_order.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用本地临时目录和记录型传输；不执行远端部署。"]
    steps:
      - id: D1
        name: 部署事务相关测试
        change_ids: ["CHG-configure-before-switch"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/dv/execution.test.ts", "tests/dv/app_management_execution.test.ts", "tests/dv/versioned_deploy_order.test.ts"]
  integration:
    mode: enabled
    summary: 验证部署准备屏障、提交顺序、补偿及相关回归
    test_targets: ["tests/integration/versioned_release.test.ts", "tests/integration/managed_transport_security.test.ts", "tests/integration/config_fingerprint.test.ts", "tests/integration/versioned_transport_boundary.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用本地临时目录和记录型传输；不执行远端部署。"]
    steps:
      - id: I1
        name: 部署事务相关测试
        change_ids: ["CHG-configure-before-switch"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/integration/versioned_release.test.ts", "tests/integration/managed_transport_security.test.ts", "tests/integration/config_fingerprint.test.ts", "tests/integration/versioned_transport_boundary.test.ts"]
