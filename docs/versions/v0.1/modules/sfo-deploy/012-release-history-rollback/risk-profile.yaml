schema_version: 1
task_manifest: task.yaml

change_ids: ["CHG-release-history", "CHG-release-history-cli", "CHG-release-rollback"]
source_bindings:
  proposal: proposal.md
  design_source: pipeline/plan.md

risks:
  contract:
    applies: true
    evidence:
      - proposal.md 定义新增 history/rollback CLI 动作、发布 ID、JSON 输出和共用 Python API，属于向后兼容的公共契约扩展
      - pipeline/plan.md 的 Exported Interfaces 与 API and Build Surface Impact 固化消费者、错误语义和兼容决策
    required_checks:
      - 验证既有 CLI 动作与 RunOptions 调用保持兼容，history 列表/详情和 rollback 参数约束、JSON 结构、错误类别与退出码稳定
      - 验证新增公开类型与函数可从 sfo_deploy 导入，错误输入、未知发布 ID 和非成功发布均在远端连接前失败
      - 验证 deploy 强制审计写入与 execute_plan 全计划本地准备的 migration-required 语义有明确文档，既有位置参数与结果判断仍兼容
  data:
    applies: true
    evidence:
      - proposal.md 要求在集群目录持久化版本化发布记录、不可变执行快照与完整性信息
      - pipeline/plan.md 的 State Ownership 定义追加式提交、schema 版本、原子发布、损坏隔离和回退读取规则
    required_checks:
      - 验证 intent 在配置装载/规划前持久化，成功、失败、取消、无 outcome incomplete 与回退记录的 schema、唯一 ID、排序、一次性 outcome、跨进程互斥及 OS 崩溃释放
      - 验证严格 plan codec、canonical JSON/hash、快照路径/数量/大小边界、缺失/额外/篡改文件和不支持 schema 均被拒绝；无 outcome 统一显示 incomplete 且不可回退，不误报活跃/崩溃状态
  security:
    applies: true
    evidence:
      - proposal.md 禁止历史、快照和输出持久化配置密钥值、私钥内容、provider 凭据或远端临时秘密
      - pipeline/plan.md 将历史根限制在选定集群目录并对记录 ID、相对路径、普通文件与哈希实施校验
    required_checks:
      - 验证秘密只以逻辑名称进入快照，历史/JSON/异常不出现绑定值或私钥内容
      - 验证恶意发布 ID、manifest 路径逃逸、逐级符号链接、超大/过深 package source、额外文件和损坏/重复键/NaN JSON 不可越过历史根或触发 SSH
      - 验证 SSH 私钥只保存相对逻辑引用并从当前集群根预检，不复制内容/绝对路径；HTTP source 拒绝 userinfo/query/fragment，filehub 只接受规范四段 target，自定义 provider 无显式版本化 export/import codec 时失败关闭
  runtime:
    applies: true
    evidence:
      - proposal.md 要求部署执行快照与实际执行输入一致，回退复用现有下载、预检、SSH 和执行链，并记录部分失败
      - pipeline/plan.md 的 Runtime Call and Lifecycle、Failure Flows 定义预检顺序、失败传播、清理和无远端副作用边界
    required_checks:
      - 验证普通 deploy 先固化并严格 decode 快照再执行同一计划，执行完成后无论成功、失败、取消或缺 outcome 都有不夸大进程状态的可解释历史投影
      - 验证 prepare_execution 在任何 connect 前解析密钥/SSH key/provider 并预下载校验所有包，execute_prepared 消费同一工件/秘密且成功失败均清理
      - 验证 derive_rollback_plan 只重放成功发布的 App configure/deploy 与传递环境 check，不重放 environment install/configure 或其它不可逆动作；成功 rollback 保留 lineage 且可再次回退
  build:
    applies: true
    evidence:
      - proposal.md 直接改变发布和回退操作面，并要求旧制品可用性、兼容与操作恢复语义
      - pipeline/plan.md 规定本次不新增第三方依赖或构建图变化，但新增生产发布默认审计行为和回退流程
    required_checks:
      - 验证不新增依赖/锁文件变化，跨平台文件锁只用标准库且进程退出自动释放；现有发布默认自动留痕，intent 写入失败时不得执行无记录部署
      - 验证 README 明确本地历史归属、磁盘增长、旧制品仍需可下载、非目标数据不回滚及运维恢复边界
  ui:
    applies: false
    evidence: 本次仅扩展命令行与 JSON 输出，不涉及图形界面、导航、无障碍或视觉交互工作流。
    required_checks: []
  harness:
    applies: false
    evidence: 不修改 Harness 规则、检查器或交付流程；只生成本任务规定的计划、测试元数据、运行证据和验收报告。
    required_checks: []
