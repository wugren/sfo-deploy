schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: none
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: [
  "src",
  "tests",
  "examples/eleph-server-multipass",
  "README.md",
  "docs/guides/sfo-deploy-cluster-configuration.md",
  "docs/changes/026-versioned-app-layout.md",
]
contract_checks:
  mode: enabled
  steps:
    - id: example-closure
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 验证示例集群 TypeScript 闭包与模板/live 一致契约
      change_ids: [
        "CHG-versioned-app-layout",
        "CHG-remote-package-hash",
        "CHG-release-config",
        "CHG-repackage",
        "CHG-docs",
      ]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/contract/verify_environment_placement_config.ts",
        "closure",
      ]
    - id: example-docs
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 验证 README/指南/示例文档边界与迁移语义
      change_ids: [
        "CHG-versioned-app-layout",
        "CHG-remote-package-hash",
        "CHG-release-config",
        "CHG-repackage",
        "CHG-docs",
      ]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/contract/verify_environment_placement_config.ts",
        "docs",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - id: real-ssh-deployment
    owner: sfo-deploy 维护者与具备隔离目标机的运维人员
    reason: 当前仓库环境没有可安全修改的真实 SSH 目标机、受信任 host key、sudo/systemd 服务与发布制品
    acceptance_impact: 自动测试以内存传输和本地替换替身验证执行链与脚本契约，但不证明某个具体发行版及网络环境的真实部署成功
levels:
  unit:
    mode: enabled
    summary: 覆盖 app_versions.yaml/app.yaml v2 装载合并与 fail-closed、v1 只读兼容、install_directory 路径拒绝、gzip 魔数断言与 v3 plan codec 新字段往返。
    test_targets: [
      "tests/unit/config_planning.test.ts",
      "tests/unit/history.test.ts",
      "tests/unit/downloads_secrets.test.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: [
        "配置测试使用临时集群目录；gzip 测试使用 node:zlib 生成合法 gzip；codec 测试用真实磁盘 archive 目录。",
      ]
    steps:
      - id: U1
        name: 配置装载合并与 fail-closed
        change_ids: ["CHG-release-config", "CHG-versioned-app-layout"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/config_planning.test.ts",
        ]
      - id: U2
        name: plan codec 新字段往返与旧快照兼容
        change_ids: ["CHG-versioned-app-layout"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/history.test.ts",
        ]
      - id: U3
        name: gzip 魔数断言
        change_ids: ["CHG-repackage"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/downloads_secrets.test.ts",
        ]
  dv:
    mode: enabled
    summary: 使用内存传输验证执行器 metadata 注入、App 安装包 SSH 前 gzip 门禁、取消与资源清理。
    test_targets: ["tests/dv/execution.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["不连接真实 SSH 目标；fixture 包为 gzip 流以通过新格式门禁。"]
    steps:
      - id: D1
        name: 执行器 metadata 与预检门禁
        change_ids: ["CHG-versioned-app-layout", "CHG-remote-package-hash", "CHG-repackage"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run=ssh,scp,filehub,deno",
          "tests/dv/execution.test.ts",
        ]
  integration:
    mode: enabled
    summary: 远端脚本发布/跳过/hash 拒绝/回滚契约、fetch gzip 门禁、独立脚本契约与模板/live 一致契约。
    test_targets: [
      "tests/integration/deploy_version_skip.test.ts",
      "tests/integration/fetch_package.test.ts",
      "tests/integration/independent_remote_scripts.test.ts",
    ]
    preconditions:
      tools: ["deno>=2", "tar>=1.34", "gzip>=1.10"]
      env: []
      services: []
      notes: [
        "脚本测试通过源文本替换注入临时安装目录与 HOME；tar 使用显式 --use-compress-program=/usr/bin/gzip 避免子进程 PATH 依赖。",
      ]
    steps:
      - id: I1
        name: 部署跳过/发布/hash 拒绝/回滚
        change_ids: ["CHG-versioned-app-layout", "CHG-remote-package-hash", "CHG-repackage"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/deploy_version_skip.test.ts",
        ]
      - id: I2
        name: fetch gzip 与本地缓存
        change_ids: ["CHG-release-config", "CHG-repackage"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/fetch_package.test.ts",
        ]
      - id: I3
        name: 独立脚本契约
        change_ids: ["CHG-versioned-app-layout", "CHG-repackage"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/independent_remote_scripts.test.ts",
        ]
      - id: I4
        name: 文档与示例契约
        change_ids: ["CHG-docs"]
        run: [
          "deno",
          "run",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/contract/verify_environment_placement_config.ts",
          "docs",
        ]
