schema_version: 1
task_manifest: task.yaml

# `risk-profile-check.py --prepare --task <packet>/task.yaml` 写入任务/变更与设计源绑定；
# 提案或设计变更后需复核本文件并重新 prepare。
change_ids: ["CHG-install-deno-path-default", "CHG-install-deno-path-docs"]
source_bindings:
  proposal: proposal.md
  design_source: design.md

# 单任务矩阵。阶段文档引用本文件，不复制矩阵。
# 提案拥有 applies/evidence；设计为适用项补 required_checks；测试实现这些检查。
risks:
  contract:
    applies: true
    evidence: [
      "src/cli.ts",
      "README.md",
      "docs/guides/sfo-deploy-cluster-configuration.md",
      "examples/eleph-server-multipass/README.md",
      "tests/contract/verify_install_deno_contract.ts",
    ]
    required_checks: [
      "unit: DEFAULT_DENO_INSTALL_ROOT=/usr/local 且缺省 outcome.denoPath=/usr/local/bin/deno",
      "unit: CLI 帮助写明缺省 /usr/local/bin/deno",
      "integration: 三份文档示例与缺省命令一致",
    ]
  data:
    applies: false
    evidence: install-deno 不写发布历史、不写 machines.yaml，也不新增持久 schema。
    required_checks: []
  security:
    applies: true
    evidence: ["src/ssh_install.ts", "src/transport.ts"]
    required_checks: [
      "unit: 缺省安装 privileged=true",
      "unit: 显式 --install-to $HOME 目录 privileged=false",
      "dv: 提权失败映射 preflight 退出码 3",
    ]
  runtime:
    applies: true
    evidence: ["src/ssh_install.ts", "src/integration.ts"]
    required_checks: [
      "unit: 缺省安装命令 DENO_INSTALL=/usr/local 且复验路径一致",
      "unit: present 探测路径为 /usr/local/bin/deno",
      "dv: 缺省安装返回 installed + /usr/local/bin/deno",
    ]
  build:
    applies: true
    evidence: ["src/cli.ts", "src/ssh_install.ts", "README.md"]
    required_checks: [
      "unit: 缺省安装脚本/环境变量与帮助契约一致",
      "integration: 文档示例契约通过",
    ]
  ui:
    applies: false
    evidence: 不涉及 UI、导航、无障碍或本地化工作流。
    required_checks: []
  harness:
    applies: false
    evidence: 不修改 Harness 规则、检查器或测试基础结构的实现。
    required_checks: []
