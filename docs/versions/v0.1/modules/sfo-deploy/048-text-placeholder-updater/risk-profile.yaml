schema_version: 1
task_manifest: task.yaml

# `risk-profile-check.py --prepare --task <packet>/task.yaml` machine-writes the
# task/change and active-source bindings below. Proposal owns applies/evidence;
# design owns required_checks for applicable categories.
change_ids: [
  "CHG-template-updater-control",
  "CHG-template-updater-remote",
  "CHG-template-updater-docs-tests",
]
source_bindings:
  proposal: proposal.md
  design_source: design.md

risks:
  contract:
    applies: true
    evidence:
      - proposal.md 的 P-001 要求 app.yaml schema v3 `management.configs[].updater.type` 新增 `template`，扩展集群配置装载契约；既有四种结构化 updater 与 script updater 装载结果逐字段不变
      - proposal.md 的 P-001/P-002 要求部署包新增 template 骨架与绑定清单成员形态，远端 config_updater bundle 协议同步扩展
      - src/config.ts 是唯一配置装载实现，docs/guides/sfo-deploy-cluster-configuration.md 与 README.md 是契约文档消费者
    required_checks:
      - app.yaml `updater.type: template` 装载成功路径与全部失败路径（重复 placeholder、未声明秘密、非法名称、非空 variables、未知字段）行为与错误文案符合设计；既有 yaml/json/toml/ini/script 装载结果回归逐字段不变
      - 部署包对 template 输出 skeleton + bindings.json（selector null、type string、updater template），远端接受同一形态；既有格式成员形态不变
      - 指南与 README 的 template 声明示例、占位符语法（仅 ${NAME} + $$、无裸 $NAME）与实现行为一致，contract 校验覆盖
  data:
    applies: true
    evidence:
      - proposal.md 的 P-002 改变部署包成员与绑定清单内容；plan/history 快照会携带 template 绑定 kind，发布历史解码面必须接受新 kind 且不破坏既有记录
      - src/history.ts 对绑定 kind 有显式解码校验，是持久发布历史的持久化消费点
    required_checks:
      - plan/history 快照对 template updater 的 encode/decode 往返逐字段一致；既有 yaml/json/toml/ini/script 快照解码结果不变
      - 旧快照（无 template）由新二进制解码不回归；文档说明旧二进制不能解码含 template 的新快照
  security:
    applies: true
    evidence:
      - proposal.md 的 In scope 要求秘密值注入文本，保持失败关闭：未知占位符、重复 selector、类型不匹配、残留 marker、非法 UTF-8、超限即失败，不发布
      - proposal.md 的 In scope 要求秘密不进 argv/env/stdout；远端 updater 只获得 bindings 显式列出的秘密副本
      - 占位符语法已裁定为仅 `${NAME}` + `$$` 转义，未声明占位符拒绝
    required_checks:
      - 控制端骨架绝不包含秘密值；未知/非法占位符、保留前缀、声明未使用、variables 互斥全部失败关闭并有测试
      - 远端 template 替换保持 deny env/net/run/FFI、秘密仅从受限目录读取、错误信息不含秘密或候选内容；残留 marker、UTF-8、大小校验在 template 分支生效
      - marker 全量替换后候选经既有 #assertCandidate 守卫；发布失败/回退路径不落 target
  runtime:
    applies: true
    evidence:
      - proposal.md 的 P-002 要求远端 config_updater 支持 template 文本替换，更新 bundle 并保持 `--no-remote --no-npm` 离线执行
      - 原子发布、validator、on_change 服务动作语义沿用既有链路，需要回归证据
    required_checks:
      - `--format template` 经固定 argv 到达远端 bundle 并成功产出候选；timeout_ms、validator、on_change 沿用路径回归
      - bundle 以 `--no-remote --no-npm --deny-*` 离线执行（integration 覆盖）
  build:
    applies: true
    evidence:
      - proposal.md 的 P-002 要求重新编译交付远端 runtime bundle（config_updater.bundle.js 为仓库内提交产物）
      - 不新增第三方依赖；deno.lock 不变
    required_checks:
      - `deno task bundle:remote-runtime` 重新生成提交产物；`deno check` 覆盖 config_updater.ts；deno.lock 无变化
  ui:
    applies: false
    evidence: 本任务没有图形界面、导航、前端状态或无障碍表面；CLI 行为不变，错误文案属于 contract 检查。
    required_checks: []
  harness:
    applies: true
    evidence:
      - proposal.md 的 P-003 要求补齐 unit/integration/contract 测试并保持 `deno task check` 全绿，文档同步更新
      - design.md 的 Directly Mapped Change Items 将测试实现、testplan.yaml、runner 注册限定为本任务的测试责任
      - harness/scripts/test-run.py 是任务注册消费者，不改变 Harness 规则或其他任务语义
    required_checks:
      - testplan.yaml 精确映射三个 change_id 与适用风险 required_checks，步骤可从 sfo-deploy/048-text-placeholder-updater all 到达
      - runner list 只新增本任务 scope 且既有 scope/命令保持不变，成功运行写出覆盖本任务 testplan 和三个 change_id 的机器制品
      - unit/integration/contract 新增用例覆盖成功替换与全部失败关闭路径；`deno task check` 全绿
