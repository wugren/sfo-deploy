schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: true
  documentation_examples_affected: true
evidence_inputs: ["src", "tests", "README.md", "docs/guides/sfo-deploy-cluster-configuration.md"]
contract_checks:
  mode: enabled
  steps:
    - id: template-new-path-compiles
      kind: external-positive
      assertion: new-path-compiles
      name: 新路径编译并端到端：template 装载、骨架、marker 全量替换产出候选
      change_ids: [
        "CHG-template-updater-control",
        "CHG-template-updater-remote",
        "CHG-template-updater-docs-tests",
      ]
      run: [
        "deno",
        "test",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/integration/config_updater.test.ts",
      ]
    - id: repository-compile-closure
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 生产入口类型检查闭包（deno task check）
      change_ids: [
        "CHG-template-updater-control",
        "CHG-template-updater-remote",
        "CHG-template-updater-docs-tests",
      ]
      run: ["deno", "task", "check"]
    - id: documentation-examples
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 文档/示例契约：template 声明、占位符语法与失败关闭表述
      change_ids: [
        "CHG-template-updater-control",
        "CHG-template-updater-remote",
        "CHG-template-updater-docs-tests",
      ]
      run: [
        "deno",
        "test",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/contract/verify_app_management_contract.ts",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps: []
levels:
  unit:
    mode: enabled
    summary: 覆盖 template updater 装载成功/失败路径、骨架占位符扫描与 `$$`/保留前缀语义、marker 确定性、plan 快照 encode/decode 往返与既有格式回归。
    test_targets: [
      "tests/unit/app_management_config.test.ts",
      "tests/unit/managed_config_generation.test.ts",
      "tests/unit/history.test.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["全部用例离线运行，仅使用临时目录夹具。"]
    steps:
      - id: U1
        name: template updater 装载规范化、缺省占位符、互斥 variables 与全部失败关闭路径
        change_ids: ["CHG-template-updater-control"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/app_management_config.test.ts",
        ]
      - id: U2
        name: template 骨架占位符替换、字面 $/保留前缀/未声明/缺席失败关闭与 marker 确定性
        change_ids: ["CHG-template-updater-control"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/managed_config_generation.test.ts",
        ]
      - id: U3
        name: plan/history 快照 template updater 编解码往返与既有快照回归
        change_ids: ["CHG-template-updater-control"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/history.test.ts",
        ]
      - id: U4
        name: CLI 计划序列化与 planning 最小秘密集合回归（含 template 绑定归一）
        change_ids: ["CHG-template-updater-control"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/config_planning.test.ts",
          "tests/unit/cli_human_output.test.ts",
        ]
  dv:
    mode: disabled
    reason: 本任务为装载/骨架/替换的确定性文本分支，不涉及 deno dv 执行、内存传输或生命周期工作流，无 DV 断言可登记。
  integration:
    mode: enabled
    summary: 通过集成测试验证远端 template marker 全量替换与失败关闭，并经契约脚本验证指南/README 的 template 表述与既有文档边界。
    test_targets: [
      "tests/integration/config_updater.test.ts",
      "tests/contract/verify_app_management_contract.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["契约脚本只读仓库文档；集成测试自建临时秘密目录。"]
    steps:
      - id: I1
        name: 远端 template 按原文全量替换、不转义、无残留，marker 缺失与非法绑定失败关闭
        change_ids: ["CHG-template-updater-remote"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/config_updater.test.ts",
        ]
      - id: I2
        name: 契约：指南/README template 声明、占位符语法与文档边界
        change_ids: ["CHG-template-updater-docs-tests"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/contract/verify_app_management_contract.ts",
        ]
