schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: true
  documentation_examples_affected: true
evidence_inputs: ["src", "tests", "README.md", "docs", "skills/sfo-deploy-cluster"]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 仓库类型闭包
      change_ids: ["CHG-declarative-environment-install", "CHG-declarative-environment-service", "CHG-declarative-environment-conflicts", "CHG-declarative-environment-docs"]
      run: ["deno", "task", "check"]
    - id: C2
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: Environment 生命周期文档契约
      change_ids: ["CHG-declarative-environment-install", "CHG-declarative-environment-service", "CHG-declarative-environment-conflicts", "CHG-declarative-environment-docs"]
      run: ["deno", "run", "--frozen", "--allow-read", "tests/contract/verify_environment_management_contract.ts"]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - "真实 Ubuntu/CentOS 主机不在本环境可用；package manager/service manager 的真实发行版兼容性记录为 manual gap。"
levels:
  unit:
    mode: enabled
    summary: 覆盖配置契约、计划形状、包管理器和服务管理器命令与失败语义
    test_targets:
      - "tests/unit/environment_management_config.test.ts"
      - "tests/unit/environment_management_planning.test.ts"
      - "tests/unit/environment_management.test.ts"
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用本地临时目录和远端会话替身，不连接部署节点。"]
    steps:
      - id: U1
        name: 配置装载与冲突
        change_ids: ["CHG-declarative-environment-install", "CHG-declarative-environment-service", "CHG-declarative-environment-conflicts", "CHG-declarative-environment-docs"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/unit/environment_management_config.test.ts"]
      - id: U2
        name: 生命周期计划
        change_ids: ["CHG-declarative-environment-install", "CHG-declarative-environment-service", "CHG-declarative-environment-conflicts", "CHG-declarative-environment-docs"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/unit/environment_management_planning.test.ts"]
      - id: U3
        name: 安装与服务运行时
        change_ids: ["CHG-declarative-environment-install", "CHG-declarative-environment-service", "CHG-declarative-environment-conflicts", "CHG-declarative-environment-docs"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/unit/environment_management.test.ts"]
  dv:
    mode: enabled
    summary: 覆盖 prepare 的 install -> start/restart 执行流
    test_targets: ["tests/dv/environment_management_execution.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用记录型远端会话替身，不执行真实安装或服务操作。"]
    steps:
      - id: D1
        name: prepare 执行顺序
        change_ids: ["CHG-declarative-environment-install", "CHG-declarative-environment-service", "CHG-declarative-environment-conflicts", "CHG-declarative-environment-docs"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/dv/environment_management_execution.test.ts"]
  integration:
    mode: enabled
    summary: 覆盖 plan v4 可选字段持久化和重放
    test_targets: ["tests/integration/environment_management_history.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["只读写本地临时目录。"]
    steps:
      - id: I1
        name: 计划快照往返
        change_ids: ["CHG-declarative-environment-install", "CHG-declarative-environment-service", "CHG-declarative-environment-conflicts", "CHG-declarative-environment-docs"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/integration/environment_management_history.test.ts"]
