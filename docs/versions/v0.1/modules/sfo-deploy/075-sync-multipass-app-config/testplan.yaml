schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: false
evidence_inputs: ["src/config.ts", "tests/unit/app_management_config.test.ts", "tests/dv/versioned_deploy_order.test.ts", "tests/integration/versioned_transport_boundary.test.ts", "tests/integration/managed_transport_security.test.ts", "examples/eleph-server-multipass/clusters/multipass/apps", "examples/eleph-server-multipass/clusters/multipass/cluster.yaml"]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 仓库编译闭包
      change_ids: ["CHG-sync-multipass-app-config"]
      run: ["deno", "task", "check"]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps: []
levels:
  unit:
    mode: enabled
    summary: 覆盖 schema 1 变量绑定、变量展开和缺声明失败关闭
    test_targets: ["tests/unit/app_management_config.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["只使用本地临时目录。"]
    steps:
      - id: U1
        name: schema 1 安装目录变量装载
        change_ids: ["CHG-sync-multipass-app-config"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "tests/unit/app_management_config.test.ts"]
  dv:
    mode: enabled
    summary: 覆盖 latest 选择器到候选版本的部署、configure 和失败恢复语义
    test_targets: ["tests/dv/versioned_deploy_order.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用本地临时目录和记录型传输，不执行远端部署。"]
    steps:
      - id: D1
        name: 版本部署路径与顺序
        change_ids: ["CHG-sync-multipass-app-config"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/dv/versioned_deploy_order.test.ts"]
  integration:
    mode: enabled
    summary: 覆盖发布根边界、受管配置事务和实际 multipass 配置计划
    test_targets:
      - tests/integration/versioned_transport_boundary.test.ts
      - tests/integration/managed_transport_security.test.ts
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["本地临时目录和伪远端会话；validate/plan 不连接节点。"]
    steps:
      - id: I1
        name: 版本配置边界与事务
        change_ids: ["CHG-sync-multipass-app-config"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/integration/versioned_transport_boundary.test.ts", "tests/integration/managed_transport_security.test.ts"]
      - id: I2
        name: multipass 配置校验
        change_ids: ["CHG-sync-multipass-app-config"]
        run: ["deno", "run", "--allow-read", "--allow-env", "src/main.ts", "validate", "--config-root", "examples/eleph-server-multipass/clusters", "--cluster", "multipass"]
      - id: I3
        name: multipass 部署计划
        change_ids: ["CHG-sync-multipass-app-config"]
        run: ["deno", "run", "--allow-read", "--allow-env", "src/main.ts", "plan", "--config-root", "examples/eleph-server-multipass/clusters", "--cluster", "multipass"]
