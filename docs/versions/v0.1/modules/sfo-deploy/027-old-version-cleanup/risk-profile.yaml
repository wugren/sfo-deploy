schema_version: 1
task_manifest: task.yaml

change_ids: ["CHG-version-retention-config", "CHG-cleanup-execution", "CHG-cleanup-docs"]
source_bindings:
  proposal: proposal.md
  design_source: design.md

risks:
  contract:
    applies: true
    evidence:
      - proposal.md 的 P-001/P-002 定义用户配置 keep_versions 与 App deploy metadata 扩展
      - proposal.md 的 Confirmed Decisions 固化默认 5、全局配置与触发时机
    required_checks:
      - 用户配置 keep_versions 装载/默认值/非法值拒绝测试
      - 执行器 App deploy metadata 注入 keep_versions 的契约测试
  data:
    applies: true
    evidence:
      - proposal.md 的 P-002 与 Risks 定义版本目录与 ~/.sfo-deploy/apps 安装包的自动删除边界
      - proposal.md 的 Success Criteria 定义保留最新 N 个与失败不清理语义
    required_checks:
      - 超过保留数时仅最旧版本被清理、latest/当前不受影响的集成测试
      - 失败/回滚/同版本跳过不清理与路径逃逸拒绝测试
  security:
    applies: true
    evidence:
      - proposal.md 的 安全约束 与 Risks 定义删除路径校验、VERSION 标记验证与命令白名单
    required_checks:
      - 删除路径逃逸/非版本目录误删拒绝测试
      - deploy 脚本 run 白名单覆盖 ls/rm 的契约测试
  runtime:
    applies: true
    evidence:
      - proposal.md 的 P-002 与 Confirmed Decisions 定义成功路径后的清理生命周期
    required_checks:
      - 成功发布后清理、失败/回滚不清理的流程测试
      - 清理过程资源与临时文件处理测试
  build:
    applies: false
    evidence: 本任务不新增第三方依赖、不改变构建产物与安装入口；Deno 类型检查与统一测试入口覆盖。
    required_checks: []
  ui:
    applies: false
    evidence: 本任务没有图形界面、导航或辅助功能表面；命令行交互按 contract 与 runtime 风险验证。
    required_checks: []
  harness:
    applies: true
    evidence:
      - task.yaml 定义三个 change_id；testing/testplan 需覆盖每个 change_id
      - proposal.md 的 Required evidence 要求任务级统一测试入口与模板/live 一致契约
    required_checks:
      - 任务级统一测试入口运行本任务 unit/dv/integration 测试计划
      - testing.md/testplan.yaml 与实现、风险档案 required_checks 一致
