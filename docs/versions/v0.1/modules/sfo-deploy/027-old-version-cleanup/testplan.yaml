schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: none
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: [
  "src",
  "tests",
  "examples/eleph-server-multipass",
  "README.md",
  "docs/guides/sfo-deploy-cluster-configuration.md",
  "docs/changes/027-old-version-cleanup.md",
]
contract_checks:
  mode: enabled
  steps:
    - id: example-closure
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 验证示例集群 TypeScript 闭包与模板/live 一致契约
      change_ids: ["CHG-version-retention-config", "CHG-cleanup-execution", "CHG-cleanup-docs"]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/contract/verify_environment_placement_config.ts",
        "closure",
      ]
    - id: example-docs
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 验证 README/指南/示例文档边界
      change_ids: ["CHG-version-retention-config", "CHG-cleanup-execution", "CHG-cleanup-docs"]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/contract/verify_environment_placement_config.ts",
        "docs",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - id: real-ssh-deployment
    owner: sfo-deploy 维护者与具备隔离目标机的运维人员
    reason: 当前仓库环境没有可安全修改的真实 SSH 目标机、受信任 host key、sudo/systemd 服务与发布制品
    acceptance_impact: 自动测试以本地替身验证清理流程与边界，但不证明某个具体发行版及网络环境的真实部署结果
levels:
  unit:
    mode: enabled
    summary: 覆盖 keep_versions 用户配置默认值、合法值与非法值拒绝。
    test_targets: ["tests/unit/user_config.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["配置测试使用临时 home 目录与临时配置文件。"]
    steps:
      - id: U1
        name: keep_versions 用户配置
        change_ids: ["CHG-version-retention-config"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/user_config.test.ts",
        ]
  dv:
    mode: enabled
    summary: 覆盖执行器 App deploy metadata 注入与非法 keep_versions 拒绝。
    test_targets: ["tests/dv/execution.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["不连接真实 SSH 目标。"]
    steps:
      - id: D1
        name: 执行器 metadata 与参数校验
        change_ids: ["CHG-version-retention-config"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run=ssh,scp,filehub,deno",
          "tests/dv/execution.test.ts",
        ]
  integration:
    mode: enabled
    summary: 覆盖成功清理、失败不清理、数据目录保护与模板/live 一致契约。
    test_targets: ["tests/integration/deploy_version_skip.test.ts"]
    preconditions:
      tools: ["deno>=2", "tar>=1.34", "gzip>=1.10"]
      env: []
      services: []
      notes: ["脚本测试通过源文本替换注入临时安装目录与 HOME。"]
    steps:
      - id: I1
        name: 清理/不清理/数据目录保护
        change_ids: ["CHG-cleanup-execution", "CHG-version-retention-config"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/deploy_version_skip.test.ts",
        ]
      - id: I2
        name: 文档与示例契约
        change_ids: ["CHG-cleanup-docs"]
        run: [
          "deno",
          "run",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/contract/verify_environment_placement_config.ts",
          "docs",
        ]
