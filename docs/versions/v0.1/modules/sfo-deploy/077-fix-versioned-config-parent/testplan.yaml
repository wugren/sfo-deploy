schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: ["src", "tests/integration/versioned_transport_boundary.test.ts", "tests/dv/versioned_deploy_order.test.ts", "tests/contract/verify_app_management_contract.ts", "README.md", "docs/guides/sfo-deploy-cluster-configuration.md", "docs/modules/sfo-deploy.md", "examples/eleph-server-multipass/README.md", "skills/sfo-deploy-cluster"]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 仓库类型闭包
      change_ids: ["CHG-versioned-config-parent"]
      run: ["deno", "task", "check"]
    - id: C2
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 配置文档与示例契约
      change_ids: ["CHG-versioned-config-parent"]
      run: ["deno", "run", "--frozen", "--allow-read", "tests/contract/verify_app_management_contract.ts"]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - change_ids: ["CHG-versioned-config-parent"]
    reason: 不执行真实 SSH/Multipass/systemd 部署；远端行为用伪命令传输边界测试验证。
levels:
  unit:
    mode: disabled
    reason: 发布器需要真实远端命令边界；分支与顺序行为由 integration 级命令伪传输直接覆盖。
    test_targets: []
    preconditions:
      tools: []
      env: []
      services: []
      notes: ["本任务未新增可独立调用的纯函数接口。"]
    steps: []
  dv:
    mode: enabled
    summary: 覆盖 stage/activate 顺序、失败恢复与配置发布协作
    test_targets: ["tests/dv/versioned_deploy_order.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用本地临时目录和记录型会话，不执行真实远端部署。"]
    steps:
      - id: D1
        name: versioned 部署顺序
        change_ids: ["CHG-versioned-config-parent"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/dv/versioned_deploy_order.test.ts"]
  integration:
    mode: enabled
    summary: 覆盖缺失父目录、目录边界、符号链接拒绝和原子发布顺序
    test_targets: ["tests/integration/versioned_transport_boundary.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用命令伪传输验证远端操作顺序，不连接真实节点。"]
    steps:
      - id: I1
        name: 版本配置父目录与边界
        change_ids: ["CHG-versioned-config-parent"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/integration/versioned_transport_boundary.test.ts"]
