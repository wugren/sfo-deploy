schema_version: 1
task_manifest: task.yaml

# `risk-profile-check.py --prepare --task <packet>/task.yaml` machine-writes the
# task/change and active-source bindings below. Proposal owns applies/evidence;
# automatic design owns required_checks for applicable categories.
change_ids: ["CHG-drop-app-v1", "CHG-drop-cluster-v1-environments", "CHG-v1-doc-tests"]
source_bindings:
  proposal: proposal.md
  design_source: design.md

risks:
  contract:
    applies: true
    evidence:
      - proposal.md 的 P-001/P-002 要求删除两条文档化的只读兼容配置契约（app.yaml schema v1 内联 version/package，cluster v1 每机环境布局），v1 装载即失败并给出升级方向
      - design.md 的 API and Build Surface Impact 与 Consumer Migration Closure 固化受支持形态收敛为 cluster.yaml v2 + app.yaml v2/v3 + app_versions.yaml，v2/v3 行为保持字节级不变
      - src/config.ts 是唯一配置装载实现，README.md 与 docs/guides/sfo-deploy-cluster-configuration.md 是契约文档消费者
    required_checks:
      - app.yaml schema_version: 1 与 cluster.yaml schema_version: 1 装载即报错，错误信息明确指向受支持版本；v2/v3 与 cluster v2 的既有配置装载结果逐字段不变
      - app_versions.yaml 存在时所有 App 强制 v2/v3；环境共享定义 + 集中放置语义不因删除 v1 分支而改变
      - 仓库具体消费者（示例集群、 fixtures、指南）与受支持形态一致，deno check 覆盖公开导出
  data:
    applies: false
    evidence: 本任务只删除配置读入分支，不触碰执行计划、发布历史、秘密目录或任何持久运行状态；无数据/schema/迁移影响。
    required_checks: []
  security:
    applies: true
    evidence:
      - proposal.md 的 In scope 要求保留 v2 装载对 v1 每机布局目录的 fail-closed 报错，避免删除后出现静默歧义解析
      - src/config.ts 的 contained/path 校验与 secrets/依赖校验保持原样，不因分支删除扩大或缩窄校验表面
    required_checks:
      - v2 集群中出现 environments/<机器>/<环境>/ 每机布局目录仍被明确拒绝；无任何路径以猜测方式落入共享定义读取
      - 删除分支后秘密声明、机器引用、依赖与 App/环境的既有校验路径不受影响，同一负例集合继续失败关闭
  runtime:
    applies: false
    evidence: 装载期静态类型变化带不动计划生成/远端执行/传输等运行链控制流；无运行时集成影响。
    required_checks: []
  build:
    applies: false
    evidence: 不新增或删除第三方依赖，不改变构建产物、锁文件或供应链表面；仅 TypeScript 源码内删除分支。
    required_checks: []
  ui:
    applies: false
    evidence: 本任务没有图形界面、导航、前端状态或无障碍表面；CLI/错误文案属于 contract 检查。
    required_checks: []
  harness:
    applies: true
    evidence:
      - proposal.md 的 P-003 要求同步改写夹具与测试并保持全量测试通过
      - design.md 的 Directly Mapped Change Items 将测试实现、testplan.yaml、runner 注册限定为本任务的测试责任
      - harness/scripts/test-run.py 是任务注册消费者，不改变 Harness 规则或其他任务语义
    required_checks:
      - testplan.yaml 精确映射三个 change_id 与适用风险 required_checks，步骤可从 sfo-deploy/047-remove-v1-config-layouts all 到达
      - runner list 只新增本任务 scope 且既有 scope/命令保持不变，成功运行写出覆盖本任务 testplan 和三个 change_id 的机器制品
      - 返回修复验证覆盖 v1 app.yaml、cluster v1 布局、v1 布局目录 fail-closed 与文档/错误信息一致反例
