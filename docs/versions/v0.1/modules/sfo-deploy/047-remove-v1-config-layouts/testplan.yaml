schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: breaking
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: [
  "src",
  "tests",
  "examples/eleph-server-multipass",
  "README.md",
  "docs/guides/sfo-deploy-cluster-configuration.md",
  "docs/changes/047-remove-v1-config-layouts.md",
]
contract_checks:
  mode: enabled
  steps:
    - id: new-path-compiles
      kind: external-positive
      assertion: new-path-compiles
      name: 编译双向契约：v2/v3 配置路径仍可装载且示例集群闭包可编译
      change_ids: ["CHG-drop-app-v1", "CHG-drop-cluster-v1-environments", "CHG-v1-doc-tests"]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/contract/verify_environment_placement_config.ts",
        "closure",
      ]
    - id: old-path-rejected
      kind: external-negative
      assertion: old-path-rejected-for-removed-symbol
      name: v1 路径被移除：cluster v1 布局与 app.yaml v1 均被版本门禁拒绝
      change_ids: ["CHG-drop-app-v1", "CHG-drop-cluster-v1-environments", "CHG-v1-doc-tests"]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/contract/verify_environment_placement_config.ts",
        "v1-rejection",
      ]
    - id: removed-symbol-scan
      kind: removed-symbol-scan
      assertion: no-unallowlisted-old-symbol-references
      name: 仓库范围扫描：不允许残留未豁免的 v1 旧形态引用
      change_ids: ["CHG-drop-app-v1", "CHG-drop-cluster-v1-environments", "CHG-v1-doc-tests"]
      run: [
        "python",
        "./harness/scripts/consumer-closure-check.py",
        "--version",
        "v0.1",
        "--module",
        "sfo-deploy",
        "--task-name",
        "047-remove-v1-config-layouts",
      ]
    - id: repository-compile-closure
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 生产入口类型检查闭包
      change_ids: ["CHG-drop-app-v1", "CHG-drop-cluster-v1-environments", "CHG-v1-doc-tests"]
      run: ["deno", "task", "check"]
    - id: documentation-examples
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 文档/示例契约：v2 布局、移除表述、不兼容不降级边界
      change_ids: ["CHG-drop-app-v1", "CHG-drop-cluster-v1-environments", "CHG-v1-doc-tests"]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/contract/verify_environment_placement_config.ts",
        "docs",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - id: packageless-app-scripts-test
    owner: 046-app-service-management 后续跟进
    reason: 示例模板 nginx 脚本已改为 update-config.ts，旧的 configure.ts/restart.ts 引用使该集成测试先存失败，与本任务（v1 形态删除）无关
    acceptance_impact: 本任务未触碰 packageless App 执行路径；仍记录为先存缺陷，由 046 收尾时修复
  - id: secrets-subset-test
    owner: secrets 任务后续跟进
    reason: 顶层 secret_files 声明的作用域断言与实现不符（deploy 步骤也传播文件密钥），先存失败
    acceptance_impact: 本任务未触碰秘密作用域逻辑；记录为先存缺陷，另行定位
levels:
  unit:
    mode: enabled
    summary: 覆盖 app.yaml/cluster.yaml 版本收窄、v1 拒收负例、每机布局 fail-closed 守卫以及 v2/v3 既存装载行为回归。
    test_targets: [
      "tests/unit/config_planning.test.ts",
      "tests/unit/app_management_config.test.ts",
      "tests/unit/environment_placement.test.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["配置测试使用临时集群目录，不连接 SSH。"]
    steps:
      - id: U1
        name: App 配置装载、v1 内联拒收与 app_versions 闭合
        change_ids: ["CHG-drop-app-v1", "CHG-v1-doc-tests"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/config_planning.test.ts",
        ]
      - id: U2
        name: App v2/v3 无 management 的 legacy 行为回归
        change_ids: ["CHG-drop-app-v1"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/app_management_config.test.ts",
        ]
      - id: U3
        name: Environment 放置装载与 cluster v1 拒收
        change_ids: ["CHG-drop-cluster-v1-environments", "CHG-v1-doc-tests"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/environment_placement.test.ts",
        ]
  dv:
    mode: disabled
    reason: 本任务为装载期静态分支删除，不涉及 deno dv 执行、内存传输或生命周期工作流，无 DV 断言可登记。
  integration:
    mode: enabled
    summary: 通过集成测试与契约脚本分别验证公开装载/规划 API 的 v2 归一行为、文档/示例边界、移除符号扫描与编译闭包。
    test_targets: [
      "tests/integration/environment_placement.test.ts",
      "tests/contract/verify_environment_placement_config.ts",
    ]
    preconditions:
      tools: ["deno>=2", "python>=3.11"]
      env: []
      services: []
      notes: [
        "契约脚本以自建临时目录验证 v1 拒收；consumer-closure 扫描 evidence_inputs。",
      ]
    steps:
      - id: I1
        name: 公开装载与规划 API 的 v2 归一行为
        change_ids: ["CHG-drop-cluster-v1-environments"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/environment_placement.test.ts",
        ]
      - id: I2
        name: 契约：v2 闭包可编译
        change_ids: ["CHG-drop-app-v1", "CHG-drop-cluster-v1-environments", "CHG-v1-doc-tests"]
        run: [
          "deno",
          "run",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/contract/verify_environment_placement_config.ts",
          "closure",
        ]
      - id: I3
        name: 契约：文档/示例 v2 与移除边界
        change_ids: ["CHG-v1-doc-tests"]
        run: [
          "deno",
          "run",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/contract/verify_environment_placement_config.ts",
          "docs",
        ]
      - id: I4
        name: 契约：v1 路径被拒收（外部负例）
        change_ids: ["CHG-drop-app-v1", "CHG-drop-cluster-v1-environments"]
        run: [
          "deno",
          "run",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/contract/verify_environment_placement_config.ts",
          "v1-rejection",
        ]
