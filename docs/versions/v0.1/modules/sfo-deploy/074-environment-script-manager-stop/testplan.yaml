schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: migration-required
  crate_root_export_change: false
  build_surface_change: true
  documentation_examples_affected: true
evidence_inputs: ["src", "tests", "README.md", "docs/guides/sfo-deploy-cluster-configuration.md", "docs/modules/sfo-deploy.md", "skills/sfo-deploy-cluster/references/environment.md", "examples/eleph-server-multipass"]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 仓库类型闭包
      change_ids: ["CHG-environment-script-manager-stop"]
      run: ["deno", "task", "check"]
    - id: C2
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: Environment script manager stop 文档契约
      change_ids: ["CHG-environment-script-manager-stop"]
      run: ["deno", "run", "--frozen", "--allow-read", "tests/contract/verify_environment_management_contract.ts"]
    - id: C3
      kind: external-positive
      assertion: new-path-compiles
      name: script manager stop 新契约编译
      change_ids: ["CHG-environment-script-manager-stop"]
      run: ["deno", "check", "src/types.ts", "src/config.ts"]
    - id: C4
      kind: removed-symbol-scan
      assertion: no-unallowlisted-old-symbol-references
      name: 旧 script manager 形状残留扫描
      change_ids: ["CHG-environment-script-manager-stop"]
      run: ["python", "harness/scripts/consumer-closure-check.py", "--version", "v0.1", "--module", "sfo-deploy", "--task-name", "074-environment-script-manager-stop"]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - "真实 Ubuntu/CentOS 主机不在本环境可用；stop 脚本的真实服务状态语义记录为 manual gap。"
levels:
  unit:
    mode: enabled
    summary: 覆盖 script manager stop 装载、计划选择和失败关闭
    test_targets:
      - "tests/unit/environment_management_config.test.ts"
      - "tests/unit/environment_management_planning.test.ts"
      - "tests/unit/environment_management.test.ts"
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用本地临时目录和远端会话替身，不连接部署节点。"]
    steps:
      - id: U1
        name: 配置装载与冲突
        change_ids: ["CHG-environment-script-manager-stop"]
        run: ["deno", "test", "-A", "tests/unit/environment_management_config.test.ts"]
      - id: U2
        name: stop 计划语义
        change_ids: ["CHG-environment-script-manager-stop"]
        run: ["deno", "test", "-A", "tests/unit/environment_management_planning.test.ts"]
      - id: U3
        name: 服务运行时回归
        change_ids: ["CHG-environment-script-manager-stop"]
        run: ["deno", "test", "-A", "tests/unit/environment_management.test.ts"]
  dv:
    mode: enabled
    summary: 覆盖 stop 步骤执行 script manager 调用
    test_targets: ["tests/dv/environment_management_execution.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用临时脚本和远端会话替身，不停止真实服务。"]
    steps:
      - id: D1
        name: stop 执行流
        change_ids: ["CHG-environment-script-manager-stop"]
        run: ["deno", "test", "-A", "tests/dv/environment_management_execution.test.ts"]
  integration:
    mode: enabled
    summary: 覆盖 plan v4 stop 往返与旧快照兼容
    test_targets: ["tests/integration/environment_management_history.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["只读写本地临时目录。"]
    steps:
      - id: I1
        name: 计划快照往返与兼容
        change_ids: ["CHG-environment-script-manager-stop"]
        run: ["deno", "test", "-A", "tests/integration/environment_management_history.test.ts"]
