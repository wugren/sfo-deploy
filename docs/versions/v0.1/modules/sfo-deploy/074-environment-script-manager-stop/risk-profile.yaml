schema_version: 1
task_manifest: task.yaml
change_ids: ["CHG-environment-script-manager-stop"]
source_bindings:
  proposal: proposal.md
  design_source: design.md
risks:
  contract:
    applies: true
    evidence:
      - "proposal.md Scope 扩展 environment.yaml script manager 必需 start/stop/restart；旧 script manager 配置需要迁移"
    required_checks:
      - "tests/unit/environment_management_config.test.ts 覆盖 stop 装载、缺字段失败和字段冲突"
      - "tests/contract/verify_environment_management_contract.ts 覆盖文档契约"
  data:
    applies: true
    evidence:
      - "proposal.md Risks 记录 plan v4 兼容；旧快照缺少 stop 但仍需 start/restart 回放"
    required_checks:
      - "tests/integration/environment_management_history.test.ts 覆盖新 stop 往返和旧 start/restart 快照兼容"
  security:
    applies: true
    evidence:
      - "proposal.md Risks 要求 stop 只通过服务管理器并失败关闭；脚本权限仍显式白名单"
    required_checks:
      - "tests/unit/environment_management.test.ts 覆盖固定 service argv、权限和失败关闭"
  runtime:
    applies: true
    evidence:
      - "proposal.md Risks 记录服务中断、SysV 状态差异和 stop 状态确认"
    required_checks:
      - "tests/unit/environment_management.test.ts 覆盖 systemctl/service stop 与状态校验"
      - "tests/unit/environment_management_planning.test.ts 覆盖 direct stop 计划和脚本选择"
  build:
    applies: true
    evidence:
      - "proposal.md Scope 改变配置契约与执行面；影响 Deno 编译、文档示例和示例集群"
    required_checks:
      - "deno task check"
      - "UV_CACHE_DIR=.harness/uv-cache uv run --active python ./harness/scripts/test-run.py sfo-deploy/074-environment-script-manager-stop all"
  ui:
    applies: false
    evidence: "本任务不改变图形界面、导航或本地化。"
    required_checks: []
  harness:
    applies: true
    evidence:
      - "本任务使用 high-risk staged lifecycle、unified test entry 和 acceptance 缺陷发现门"
    required_checks:
      - "harness/scripts/lifecycle-check.py 阶段链"
      - "UV_CACHE_DIR=.harness/uv-cache uv run --active python ./harness/scripts/test-run.py sfo-deploy/074-environment-script-manager-stop all"
