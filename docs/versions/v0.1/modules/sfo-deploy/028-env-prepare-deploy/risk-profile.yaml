schema_version: 1
task_manifest: task.yaml

change_ids: [
  "CHG-env-prepare-command",
  "CHG-env-app-lifecycle",
  "CHG-app-env-ready-gate",
  "CHG-env-app-update",
  "CHG-docs-tests",
]
source_bindings:
  proposal: proposal.md
  design_source: design.md

risks:
  contract:
    applies: true
    evidence:
      - proposal.md 的 PI-1 与 Confirmed decisions 新增 prepare CLI 动作与 `--env` 短参（等价兼容 `--environment`），并要求与 `--app` 语义分离
      - proposal.md 的 PI-4 与 Confirmed decisions 保留 App 部署前环境依赖检查门禁与 `--with-dependencies` 行为
    required_checks:
      - prepare 动作注册、帮助文本、`--env`/`--environment` 等价解析与 `--app` 混用拒绝的 CLI 契约测试
      - prepare --env 只包含指定环境应用的计划过滤测试与 App 依赖检查门禁提示文本测试
  data:
    applies: true
    evidence:
      - proposal.md 的 PI-3 定义环境应用以 environment.yaml.version 与远端版本标记判定更新
      - proposal.md 的 Success Criteria 3 要求同版本且健康时跳过
    required_checks:
      - 版本标记的写入、读取、格式校验与版本比较相关单元/集成测试
      - 版本一致且检查通过时跳过 start/restart、版本变化时重装重配并 restart 的执行测试
  security:
    applies: false
    evidence: 本任务不新增秘密、凭据、提权或权限白名单；版本标记由环境自有脚本在既有权限与工作区边界内读写，框架只把 parameters.version 注入 context metadata，不引入新信任面。
    required_checks: []
  runtime:
    applies: true
    evidence:
      - proposal.md 的 PI-2 定义安装成功自动 start、更新成功自动 restart、缺脚本跳过并提示的顺序语义
      - proposal.md 的 PI-4 定义 App 部署前环境依赖检查失败时阻断的编排语义
    required_checks:
      - prepare 步骤序列（check→install(按需)→configure→start/restart）与跳过分支的 DV/集成测试
      - 环境检查失败时 prepare 失败且 App 依赖步骤阻断、说明可复现的集成测试
  build:
    applies: false
    evidence: 本任务不新增第三方依赖、不改变 deno.json 导出、构建产物或安装入口；仍由 deno check/lint/fmt 与统一测试入口覆盖。
    required_checks: []
  ui:
    applies: false
    evidence: 本任务没有图形界面、导航或辅助功能表面；命令行交互按 contract 与 runtime 风险验证。
    required_checks: []
  harness:
    applies: true
    evidence:
      - task.yaml 定义五个 change_id 与 scope_paths，要求 testing/testplan 覆盖每个 change_id
      - proposal.md 的 Success Criteria 5 要求全量检查与统一测试入口运行
    required_checks:
      - 任务级统一测试入口（sfo-deploy/028-env-prepare-deploy all）运行 unit/dv/integration 计划并写运行工件
      - testing.md/testplan.yaml 与实现、风险档案 required_checks 一致
