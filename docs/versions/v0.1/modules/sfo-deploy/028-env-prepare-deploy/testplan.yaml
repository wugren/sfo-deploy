schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: [
  "src",
  "tests",
  "README.md",
  "docs/guides/sfo-deploy-cluster-configuration.md",
  "examples/eleph-server-multipass/README.md",
  "docs/changes/028-env-prepare-deploy.md",
  "testplan.yaml",
]
contract_checks:
  mode: enabled
  steps:
    - id: docs-contract
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 验证 README/指南/示例 README 中 prepare 与 --env 示例边界
      change_ids: [
        "CHG-env-prepare-command",
        "CHG-env-app-lifecycle",
        "CHG-env-app-update",
        "CHG-app-env-ready-gate",
        "CHG-docs-tests",
      ]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-write",
        "--allow-env",
        "--allow-net",
        "--allow-run",
        "tests/contract/verify_environment_placement_config.ts",
        "docs",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - id: real-ssh-prepare
    owner: sfo-deploy 维护者与具备隔离目标机的运维人员
    reason: 当前仓库环境没有可安全修改的真实 SSH 目标机、受信任 host key 与真实环境应用制品
    acceptance_impact: 自动测试以内存传输替身验证 prepare 状态机与标记生命周期，不证明某个具体发行版在真实目标机上的安装/启动/重启成功
levels:
  unit:
    mode: enabled
    summary: 覆盖 prepare 计划序列与筛选、CLI --env/--environment 等价与拒绝 --app、既有配置与 CLI 解析回归。
    test_targets: [
      "tests/unit/env_prepare_planning.test.ts",
      "tests/unit/env_prepare_cli.test.ts",
      "tests/unit/config_planning.test.ts",
      "tests/unit/transport_cli.test.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: [
        "计划测试使用临时集群目录；CLI 测试注入隔离的 runAction 替身。",
      ]
    steps:
      - id: U1
        name: prepare 计划序列与 start/restart 按声明生成
        change_ids: ["CHG-env-prepare-command", "CHG-env-app-lifecycle"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/env_prepare_planning.test.ts",
        ]
      - id: U2
        name: prepare CLI --env 解析、等价别名、拒绝 --app 与帮助
        change_ids: ["CHG-env-prepare-command"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/env_prepare_cli.test.ts",
        ]
      - id: U3
        name: 既有配置装载与 CLI 解析回归
        change_ids: ["CHG-env-prepare-command"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/config_planning.test.ts",
          "tests/unit/transport_cli.test.ts",
        ]
  dv:
    mode: enabled
    summary: 使用内存传输验证 prepare 全部主流程与失败路径：同版本跳过、首次安装 start、更新 restart、缺生命周期脚本跳过、start 失败不写标记、App 门禁提示。
    test_targets: ["tests/dv/execution.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["不连接真实 SSH 目标；脚本源在临时目录生成。"]
    steps:
      - id: D1
        name: prepare 执行状态机与标记生命周期
        change_ids: ["CHG-env-prepare-command", "CHG-env-app-lifecycle", "CHG-env-app-update"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run=ssh,scp,filehub,deno",
          "tests/dv/execution.test.ts",
        ]
      - id: D2
        name: App 部署环境依赖检查失败提示 prepare
        change_ids: ["CHG-app-env-ready-gate"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run=ssh,scp,filehub,deno",
          "tests/dv/execution.test.ts",
        ]
  integration:
    mode: enabled
    summary: 验证 run()/CLI 到计划/执行的跨模块链：prepare 全链路部署结果、缺省全量确认门禁、公共导出与 --app 拒绝。
    test_targets: [
      "tests/integration/env_prepare_cli.test.ts",
      "tests/integration/package_cli.test.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["集成测试使用内存传输替身，不建立真实 SSH 连接。"]
    steps:
      - id: I1
        name: run() prepare 全链路与确认门禁
        change_ids: ["CHG-env-prepare-command", "CHG-env-app-lifecycle", "CHG-env-app-update"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/env_prepare_cli.test.ts",
        ]
      - id: I2
        name: 公共 CLI 导出与安装回归
        change_ids: ["CHG-env-prepare-command", "CHG-docs-tests"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/package_cli.test.ts",
        ]
