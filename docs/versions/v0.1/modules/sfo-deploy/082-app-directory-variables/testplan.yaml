schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: migration-required
  crate_root_export_change: false
  build_surface_change: false
  documentation_examples_affected: true
evidence_inputs: ["src/types.ts", "src/config.ts", "src/history.ts", "src/execution.ts", "src/systemd_unit.ts", "README.md", "docs/guides/sfo-deploy-cluster-configuration.md", "docs/modules/sfo-deploy.md", "skills/sfo-deploy-cluster/references/app.md", "examples/eleph-server-multipass/README.md", "examples/eleph-server-multipass/cluster-template/apps", "examples/eleph-server-multipass/clusters/multipass/apps", "tests/unit/app_management_config.test.ts", "tests/unit/history.test.ts", "tests/unit/managed_config_generation.test.ts", "tests/dv/versioned_deploy_order.test.ts", "tests/integration/versioned_release.test.ts", "tests/integration/config_updater.test.ts", "tests/contract/verify_app_management_contract.ts"]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: external-positive
      assertion: new-path-compiles
      name: 新目录变量正向契约
      change_ids: ["CHG-app-directory-variable-contract"]
      run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/unit/app_management_config.test.ts"]
    - id: C2
      kind: removed-symbol-scan
      assertion: no-unallowlisted-old-symbol-references
      name: 旧符号与语义迁移闭包检查
      change_ids: ["CHG-app-directory-variable-contract"]
      run: ["python3", "harness/scripts/consumer-closure-check.py", "--root", ".", "--version", "v0.1", "--module", "sfo-deploy", "--task-name", "082-app-directory-variables"]
    - id: C3
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 仓库编译闭包
      change_ids: ["CHG-app-directory-variable-contract"]
      run: ["deno", "task", "check"]
    - id: C4
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 目录变量文档与示例契约
      change_ids: ["CHG-app-directory-variable-contract"]
      run: ["deno", "test", "--allow-read", "tests/contract/verify_app_management_contract.ts"]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - "本任务不执行真实远端部署；DV/集成使用本地执行器、固定远端运行时和临时路径验证部署语义，不声称真实主机 latest 已切换或服务已重启。"
levels:
  unit:
    mode: enabled
    summary: 覆盖目录变量装载、目标根归一、非法变量、计划快照兼容和既有配置生成类型
    test_targets:
      - tests/unit/app_management_config.test.ts
      - tests/unit/history.test.ts
      - tests/unit/managed_config_generation.test.ts
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用本地临时目录装载 YAML 和计划快照，不连接部署节点。"]
    steps:
      - id: U1
        name: App 目录变量装载与边界
        change_ids: ["CHG-app-directory-variable-contract"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/unit/app_management_config.test.ts"]
      - id: U2
        name: 计划快照目标根往返与旧快照兼容
        change_ids: ["CHG-app-directory-variable-contract"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/unit/history.test.ts"]
      - id: U3
        name: Managed config helper 类型兼容
        change_ids: ["CHG-app-directory-variable-contract"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/unit/managed_config_generation.test.ts"]
  dv:
    mode: enabled
    summary: 覆盖 current、latest 和 install root 三类目标在版本化 deploy 中的实际执行器路径
    test_targets:
      - tests/dv/versioned_deploy_order.test.ts
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: ["local temporary path fixture"]
      notes: ["使用本地真实文件命令模拟远端发布边界。"]
    steps:
      - id: D1
        name: 版本化部署目录变量执行语义
        change_ids: ["CHG-app-directory-variable-contract"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/dv/versioned_deploy_order.test.ts"]
  integration:
    mode: enabled
    summary: 覆盖远端版本化脚本契约和受管配置渲染器的跨模块兼容
    test_targets:
      - tests/integration/versioned_release.test.ts
      - tests/integration/config_updater.test.ts
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: ["local Deno runtime"]
      notes: ["不执行 SSH 或真实远端主机。"]
    steps:
      - id: I1
        name: Multipass 示例与版本化运行时契约
        change_ids: ["CHG-app-directory-variable-contract"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/integration/versioned_release.test.ts"]
      - id: I2
        name: 受管配置渲染器与新配置类型兼容
        change_ids: ["CHG-app-directory-variable-contract"]
        run: ["deno", "test", "--allow-read", "--allow-write", "--allow-env", "--allow-net", "--allow-run", "tests/integration/config_updater.test.ts"]
