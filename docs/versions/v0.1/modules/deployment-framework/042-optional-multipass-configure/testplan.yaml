schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: true
  documentation_examples_affected: true
evidence_inputs: ["src", "tests", "docs", "examples/eleph-server-multipass"]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 框架与变更测试编译闭包
      change_ids: ["CHG-optional-multipass-configure"]
      run: [
        "deno",
        "check",
        "--frozen",
        "src/mod.ts",
        "src/main.ts",
        "src/cli.ts",
        "tests/unit/config_planning.test.ts",
        "tests/unit/env_prepare_planning.test.ts",
        "tests/integration/deploy_version_skip.test.ts",
        "tests/integration/environment_placement.test.ts",
        "tests/integration/independent_remote_scripts.test.ts",
        "tests/contract/verify_environment_placement_config.ts",
      ]
    - id: C2
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: Multipass 配置与文档契约
      change_ids: ["CHG-optional-multipass-configure"]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-write",
        "--allow-run",
        "--allow-env",
        "tests/contract/verify_environment_placement_config.ts",
        "docs",
      ]
levels:
  unit:
    mode: enabled
    summary: 覆盖环境和 App 的 configure 存在/省略动作序列。
    test_targets: ["tests/unit/env_prepare_planning.test.ts", "tests/unit/config_planning.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用临时目录，不连接真实 SSH。"]
    steps:
      - id: U1
        name: 可选 configure 规划单元
        change_ids: ["CHG-optional-multipass-configure"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/env_prepare_planning.test.ts",
          "tests/unit/config_planning.test.ts",
        ]
  dv:
    mode: enabled
    summary: 回归执行器步骤依赖、失败路径、取消和资源清理。
    test_targets: ["tests/dv/execution.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用内部传输替身模拟远端 SSH。"]
    steps:
      - id: D1
        name: 执行器生命周期回归
        change_ids: ["CHG-optional-multipass-configure"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/dv/execution.test.ts",
        ]
  integration:
    mode: enabled
    summary: 覆盖 Multipass 资产契约、App 发布行为和规划集成。
    test_targets: [
      "tests/integration/environment_placement.test.ts",
      "tests/integration/deploy_version_skip.test.ts",
      "tests/integration/independent_remote_scripts.test.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用仓库内脚本、临时目录和命令替身；不部署真实虚拟机。"]
    steps:
      - id: I1
        name: Multipass 与 App 发布集成
        change_ids: ["CHG-optional-multipass-configure"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/environment_placement.test.ts",
          "tests/integration/deploy_version_skip.test.ts",
          "tests/integration/independent_remote_scripts.test.ts",
        ]
      - id: I2
        name: 相关集成与文档回归
        change_ids: ["CHG-optional-multipass-configure"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/environment_placement.test.ts",
          "tests/integration/deploy_version_skip.test.ts",
          "tests/integration/independent_remote_scripts.test.ts",
        ]
