schema_version: 1
task_manifest: task.yaml

change_ids: ["CHG-optional-multipass-configure"]

source_bindings:
  proposal: proposal.md
  design_source: design.md

risks:
  contract:
    applies: true
    evidence:
      - "src/environment.ts"
      - "src/planning.ts"
      - "tests/unit/config_planning.test.ts"
      - "tests/unit/env_prepare_planning.test.ts"
      - "tests/integration/environment_placement.test.ts"
    required_checks:
      - "显式 configure 资源保持既有计划顺序；省略 configure 的环境和 App 不生成 configure 步骤且依赖链闭合。"
  data:
    applies: false
    evidence: 不修改持久化 schema、发布历史结构或数据库结构。
    required_checks: []
  security:
    applies: true
    evidence:
      - "src/execution.ts"
      - "examples/eleph-server-multipass/cluster-template/apps/jx-server/scripts/deploy.ts"
      - "examples/eleph-server-multipass/cluster-template/environments/mysql/environment.yaml"
      - "examples/eleph-server-multipass/cluster-template/environments/redis/environment.yaml"
    required_checks:
      - "无 configure 步骤时不向步骤暴露秘密；Multipass 示例不再声明仅由 configure 消费的 secret_values。"
  runtime:
    applies: true
    evidence:
      - "src/planning.ts"
      - "examples/eleph-server-multipass/cluster-template/cluster.yaml"
      - "examples/eleph-server-multipass/cluster-template/apps/jx-server/scripts/deploy.ts"
      - "examples/eleph-server-multipass/cluster-template/environments/mysql/scripts/check.ts"
    required_checks:
      - "Multipass 依赖图删除 jx-runtime 后保持 jre/mysql/redis 到 jx-server 的顺序；App deploy 不依赖 application.yml。"
  build:
    applies: true
    evidence:
      - "deno.json"
      - "examples/eleph-server-multipass/deno.json"
      - "tests/contract/verify_environment_placement_config.ts"
    required_checks:
      - "根项目与示例项目的 Deno 检查和相关合同/单元/集成测试通过。"
  ui:
    applies: false
    evidence: 不涉及图形界面或无障碍流程。
    required_checks: []
  harness:
    applies: false
    evidence: 不修改 Harness 规则或检查器；041 只做任务清单 YAML 格式修正。
    required_checks: []
