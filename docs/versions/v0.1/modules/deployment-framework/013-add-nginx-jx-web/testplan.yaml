schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: true
  documentation_examples_affected: true
evidence_inputs: [
  "src",
  "tests",
  "examples/eleph-server-multipass/cluster-template",
  "examples/eleph-server-multipass/clusters/multipass/apps/nginx",
  "examples/eleph-server-multipass/clusters/multipass/apps/jx-web",
  "examples/eleph-server-multipass/clusters/multipass/app_versions.yaml",
  "examples/eleph-server-multipass/clusters/multipass/cluster.yaml",
  "README.md",
  "docs/guides/sfo-deploy-cluster-configuration.md",
  "examples/eleph-server-multipass/README.md",
]
contract_checks:
  mode: enabled
  steps:
    - id: multipass-docs-contract
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 验证 Multipass 文档与集群配置契约
      change_ids: ["CHG-packageless-app", "CHG-nginx-app", "CHG-jx-web-app"]
      run: [
        "deno",
        "run",
        "--allow-read",
        "tests/contract/verify_environment_placement_config.ts",
        "docs",
      ]
    - id: repository-closure
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 编译闭包检查 src/tests 与 Multipass TypeScript 资产
      change_ids: ["CHG-packageless-app", "CHG-nginx-app", "CHG-jx-web-app"]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-run=deno",
        "tests/contract/verify_environment_placement_config.ts",
        "closure",
      ]
    - id: independent-remote-contract
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 验证远端脚本自包含与模板/live 一致
      change_ids: ["CHG-packageless-app", "CHG-nginx-app", "CHG-jx-web-app"]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-write",
        "--allow-run=deno",
        "tests/contract/verify_independent_remote_scripts.ts",
        "docs",
      ]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
manual_gaps:
  - id: real-multipass-deployment
    owner: 具备隔离 Multipass 环境的运维者
    reason: 自动化测试不启动真实 VM、systemd、filehub 或宿主 HTTP 服务
    acceptance_impact: 本地替身验证脚本逻辑；真实运行时行为需发布前人工验收
levels:
  unit:
    mode: enabled
    summary: 覆盖 packageless 装载、计划、非法组合、历史回退与普通 App 兼容。
    test_targets: ["tests/unit/config_planning.test.ts", "tests/unit/history.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["不连接 SSH。"]
    steps:
      - id: U1
        name: packageless schema/planning/history unit tests
        change_ids: ["CHG-packageless-app"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/config_planning.test.ts",
          "tests/unit/history.test.ts",
        ]
  dv:
    mode: enabled
    summary: 覆盖 Multipass 模板装载、依赖顺序与失败关闭。
    test_targets: ["tests/integration/environment_placement.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用临时目录复制模板，不连接 VM。"]
    steps:
      - id: D1
        name: Multipass placement and planning
        change_ids: ["CHG-packageless-app", "CHG-nginx-app", "CHG-jx-web-app"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/environment_placement.test.ts",
        ]
  integration:
    mode: enabled
    summary: 覆盖 fetch 跳过、远端脚本契约、nginx 生命周期与 jx-web 安全发布。
    test_targets: [
      "tests/integration/fetch_package.test.ts",
      "tests/integration/independent_remote_scripts.test.ts",
      "tests/integration/packageless_app_scripts.test.ts",
    ]
    preconditions:
      tools: ["deno>=2", "tar", "gzip"]
      env: []
      services: []
      notes: ["远端系统命令使用测试替身，不操作真实主机。"]
    steps:
      - id: I1
        name: fetch packageless behavior
        change_ids: ["CHG-packageless-app"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/fetch_package.test.ts",
        ]
      - id: I2
        name: independent remote script contract
        change_ids: ["CHG-nginx-app", "CHG-jx-web-app"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/independent_remote_scripts.test.ts",
        ]
      - id: I3
        name: nginx and jx-web remote scripts
        change_ids: ["CHG-nginx-app", "CHG-jx-web-app"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/packageless_app_scripts.test.ts",
        ]
