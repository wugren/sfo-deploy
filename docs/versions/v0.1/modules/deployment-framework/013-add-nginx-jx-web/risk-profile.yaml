schema_version: 1
task_manifest: task.yaml

change_ids: ["CHG-packageless-app", "CHG-nginx-app", "CHG-jx-web-app"]

source_bindings:
  proposal: proposal.md
  design_source: design.md

risks:
  contract:
    applies: true
    evidence:
      - "src/config.ts"
      - "src/types.ts"
      - "src/planning.ts"
      - "src/execution.ts"
      - "tests/unit/config_planning.test.ts"
      - "tests/integration/environment_placement.test.ts"
    required_checks:
      - "packageless App 的 YAML 装载、版本省略、动作映射、fetch 跳过和普通 App 兼容语义均有机器验证。"
  data:
    applies: false
    evidence: 不修改发布历史、数据库结构或既有持久化 schema；仅新增集群声明字段和远端配置文件替换。
    required_checks: []
  security:
    applies: true
    evidence:
      - "src/execution.ts"
      - "examples/eleph-server-multipass/cluster-template/apps/jx-server/scripts/deploy.ts"
      - "examples/eleph-server-multipass/cluster-template/apps/jx-web/scripts/deploy.ts"
      - "examples/eleph-server-multipass/cluster-template/apps/nginx/scripts/configure.ts"
    required_checks:
      - "packageless App 不上传或接收 package_path；jx-web 归档拒绝路径穿越/链接/绝对路径；Nginx 配置先验证后替换。"
  runtime:
    applies: true
    evidence:
      - "src/planning.ts"
      - "src/execution.ts"
      - "examples/eleph-server-multipass/cluster-template/cluster.yaml"
      - "examples/eleph-server-multipass/cluster-template/apps/jx-web/scripts/deploy.ts"
      - "examples/eleph-server-multipass/cluster-template/apps/nginx/scripts/configure.ts"
    required_checks:
      - "validate/plan/fetch/deploy 对 packageless 与普通 App 的顺序、失败传播、恢复与清理正确。"
  build:
    applies: true
    evidence:
      - "deno.json"
      - "examples/eleph-server-multipass/deno.json"
      - "tests/contract/verify_environment_placement_config.ts"
    required_checks:
      - "根项目和示例项目的 fmt/check/lint、定向单元/DV/集成/合同测试通过。"
  ui:
    applies: false
    evidence: 不创建或修改图形界面；仅配置通过 HTTP 提供的既有前端站点。
    required_checks: []
  harness:
    applies: false
    evidence: 不修改 Harness 规则、检查器或流程语义。
    required_checks: []
