schema_version: 1
task_manifest: task.yaml

change_ids: ["CHG-rename-sfo-deploy"]
source_bindings:
  proposal: proposal.md
  design_source: 

risks:
  contract:
    applies: true
    evidence: 发行包名、Python 导入命名空间和 CLI 入口均发生破坏性迁移，仓库内消费者必须同步更新且旧入口不保留。
    required_checks:
      - 验证新发行名、Python 导入命名空间和 CLI 入口成功，并验证旧名称入口失败
      - 扫描活跃代码与消费者，确认旧公开名称已移除
  data:
    applies: false
    evidence: 不改变持久化数据、配置 schema、序列化格式、迁移或缓存键。
    required_checks: []
  security:
    applies: false
    evidence: 不改变认证、授权、隐私、密钥处理或 SSH 信任边界。
    required_checks: []
  runtime:
    applies: true
    evidence: 远端运行时上传文件名和生命周期脚本导入路径需要原子迁移，否则远端脚本会在运行时导入失败。
    required_checks:
      - 验证远端运行时上传文件名与生命周期脚本导入路径同步迁移
  build:
    applies: true
    evidence: pyproject 构建元数据、wheel 包路径、console script、示例本地依赖和 uv.lock 均发生构建表面与产物身份变更。
    required_checks:
      - 验证 wheel 构建内容、项目元数据、console script、示例本地依赖和锁文件均使用新名称
  ui:
    applies: false
    evidence: 不包含图形界面、导航、无障碍、本地化或交互工作流变更。
    required_checks: []
  harness:
    applies: true
    evidence: 统一测试入口的模块注册键需要从 deployment-framework 迁移到 sfo-deploy，以保持任务级测试可达性。
    required_checks:
      - 验证统一测试入口可通过 sfo-deploy/005-rename-to-sfo-deploy all 执行任务测试
