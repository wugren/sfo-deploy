schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: true
  documentation_examples_affected: true
evidence_inputs: [
  "src",
  "tests",
  "docs/guides/sfo-deploy-cluster-configuration.md",
  "examples/eleph-server-multipass/deno.json",
  "examples/eleph-server-multipass/README.md",
]
contract_checks:
  mode: enabled
  steps:
    - id: C1
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 框架与变更测试编译闭包
      change_ids: [
        "CHG-cluster-secret-source",
        "CHG-cluster-known-hosts",
        "CHG-multipass-no-binding-cli",
      ]
      run: [
        "deno",
        "check",
        "--frozen",
        "src/mod.ts",
        "src/main.ts",
        "src/cli.ts",
        "tests/unit/cluster_secret_source.test.ts",
        "tests/unit/secrets_cli.test.ts",
        "tests/contract/verify_deno_contract.ts",
        "tests/contract/verify_environment_placement_config.ts",
        "tests/contract/verify_independent_remote_scripts.ts",
      ]
    - id: C2
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 集群配置与 Multipass 示例文档契约
      change_ids: [
        "CHG-cluster-secret-source",
        "CHG-cluster-known-hosts",
        "CHG-multipass-no-binding-cli",
      ]
      run: [
        "deno",
        "run",
        "--allow-read",
        "--allow-write",
        "--allow-run",
        "--allow-env",
        "tests/contract/verify_environment_placement_config.ts",
        "docs",
      ]
levels:
  unit:
    mode: enabled
    summary: 覆盖 secrets.yaml 解析、kind 分派、known_hosts 发现和 secrets-deploy CLI 行为。
    test_targets: ["tests/unit/cluster_secret_source.test.ts", "tests/unit/secrets_cli.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用临时目录和传输替身，不连接真实 SSH。"]
    steps:
      - id: U1
        name: 集群秘密来源与 known_hosts 单元
        change_ids: ["CHG-cluster-secret-source", "CHG-cluster-known-hosts"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/cluster_secret_source.test.ts",
        ]
      - id: U2
        name: secrets-deploy CLI 行为单元
        change_ids: ["CHG-cluster-secret-source", "CHG-multipass-no-binding-cli"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit/secrets_cli.test.ts",
        ]
      - id: U3
        name: 全量单元回归
        change_ids: [
          "CHG-cluster-secret-source",
          "CHG-cluster-known-hosts",
          "CHG-multipass-no-binding-cli",
        ]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/unit",
        ]
  dv:
    mode: enabled
    summary: 回归执行器秘密副本装载、脚本工作区、取消与失败清理。
    test_targets: ["tests/dv/execution.test.ts", "tests/dv/install_deno.test.ts"]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用内部传输替身模拟远端 SSH 行为。"]
    steps:
      - id: D1
        name: 执行器与安装工作流回归
        change_ids: [
          "CHG-cluster-secret-source",
          "CHG-cluster-known-hosts",
          "CHG-multipass-no-binding-cli",
        ]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/dv",
        ]
  integration:
    mode: enabled
    summary: 覆盖示例脚本契约、文档契约、安装流和通用 CLI 集成回归。
    test_targets: [
      "tests/integration/independent_remote_scripts.test.ts",
      "tests/integration/install_deno_cli.test.ts",
      "tests/integration/environment_placement.test.ts",
    ]
    preconditions:
      tools: ["deno>=2"]
      env: []
      services: []
      notes: ["使用仓库内脚本、临时目录和命令替身；不部署真实虚拟机。"]
    steps:
      - id: I1
        name: 示例与文档集成契约
        change_ids: ["CHG-cluster-secret-source", "CHG-multipass-no-binding-cli"]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration/independent_remote_scripts.test.ts",
          "tests/integration/environment_placement.test.ts",
        ]
      - id: I2
        name: 全量集成回归
        change_ids: [
          "CHG-cluster-secret-source",
          "CHG-cluster-known-hosts",
          "CHG-multipass-no-binding-cli",
        ]
        run: [
          "deno",
          "test",
          "--allow-read",
          "--allow-write",
          "--allow-env",
          "--allow-net",
          "--allow-run",
          "tests/integration",
        ]
