schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: none
  crate_root_export_change: false
  build_surface_change: true
  documentation_examples_affected: true
evidence_inputs: ["examples/eleph-server-multipass"]
contract_checks:
  mode: enabled
  steps:
    - id: independent-project-closure
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 验证独立项目的相对依赖解析、公开接口导入和非仓库根目录消费
      change_ids: ["CHG-multipass-bootstrap", "CHG-eleph-http-deploy", "CHG-example-guidance"]
      run: [".venv/Scripts/python.exe", "-m", "pytest", "-q", "examples/eleph-server-multipass/tests/test_project_install.py"]
    - id: readme-command-contract
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 验证 README 按引导、手工编辑 App YAML、校验、规划、部署和 HTTP 验收的顺序说明
      change_ids: ["CHG-multipass-bootstrap", "CHG-eleph-http-deploy", "CHG-example-guidance"]
      run: [".venv/Scripts/python.exe", "-m", "pytest", "-q", "examples/eleph-server-multipass/tests/test_readme_contract.py"]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
levels:
  unit:
    mode: enabled
    summary: 验证项目绑定、敏感输入、环境脚本、App 生命周期和 E2E 制品输入安全校验
    test_targets: ["examples/eleph-server-multipass/tests/test_cli_contract.py", "examples/eleph-server-multipass/tests/test_secrets.py", "examples/eleph-server-multipass/tests/test_environment_scripts.py", "examples/eleph-server-multipass/tests/test_lifecycle_scripts.py", "examples/eleph-server-multipass/tests/test_multipass_e2e.py"]
    preconditions: {tools: [], env: [], services: [], notes: ["使用临时目录和替身；真实 Multipass 用例在条件不足时明确跳过"]}
    steps:
      - id: example-unit
        name: 运行 CLI、密钥、环境、App 脚本和 E2E 输入单元测试
        change_ids: ["CHG-multipass-bootstrap", "CHG-eleph-http-deploy"]
        run: [".venv/Scripts/python.exe", "-m", "pytest", "-q", "examples/eleph-server-multipass/tests/test_cli_contract.py", "examples/eleph-server-multipass/tests/test_secrets.py", "examples/eleph-server-multipass/tests/test_environment_scripts.py", "examples/eleph-server-multipass/tests/test_lifecycle_scripts.py", "examples/eleph-server-multipass/tests/test_multipass_e2e.py"]
  dv:
    mode: enabled
    change_ids: ["CHG-multipass-bootstrap", "CHG-eleph-http-deploy"]
    summary: 验证生成集群、依赖规划、默认制品占位失败关闭、手工制品配置和最小 Multipass 引导边界
    test_targets: ["examples/eleph-server-multipass/tests/test_config_contract.py", "examples/eleph-server-multipass/tests/test_plan.py", "examples/eleph-server-multipass/tests/test_artifact_contract.py", "examples/eleph-server-multipass/tests/test_bootstrap.py"]
    preconditions: {tools: ["PowerShell"], env: [], services: [], notes: ["只解析 PowerShell，不创建虚拟机"]}
    steps:
      - id: example-dv
        name: 运行配置、计划、手工制品契约和 bootstrap DV 测试
        change_ids: ["CHG-multipass-bootstrap", "CHG-eleph-http-deploy"]
        run: [".venv/Scripts/python.exe", "-m", "pytest", "-q", "examples/eleph-server-multipass/tests/test_config_contract.py", "examples/eleph-server-multipass/tests/test_plan.py", "examples/eleph-server-multipass/tests/test_artifact_contract.py", "examples/eleph-server-multipass/tests/test_bootstrap.py"]
  integration:
    mode: enabled
    change_ids: ["CHG-multipass-bootstrap", "CHG-eleph-http-deploy", "CHG-example-guidance"]
    summary: 验证独立消费项目、README 契约，并显式记录真实 Multipass 条件验收是否执行
    test_targets: ["examples/eleph-server-multipass/tests/test_project_install.py", "examples/eleph-server-multipass/tests/test_readme_contract.py", "examples/eleph-server-multipass/tests/test_multipass_e2e.py"]
    preconditions: {tools: ["uv"], env: [], services: [], notes: ["真实 Multipass 需要 ELEPH_RUN_MULTIPASS_E2E=1、Multipass、有效 JAR URL/SHA 和三项部署密钥；缺少条件时真实部署用例明确 skipped/not-run"]}
    steps:
      - id: example-integration
        name: 运行独立项目、README 与真实 Multipass 条件入口测试
        change_ids: ["CHG-multipass-bootstrap", "CHG-eleph-http-deploy", "CHG-example-guidance"]
        run: [".venv/Scripts/python.exe", "-m", "pytest", "-q", "examples/eleph-server-multipass/tests/test_project_install.py", "examples/eleph-server-multipass/tests/test_readme_contract.py", "examples/eleph-server-multipass/tests/test_multipass_e2e.py"]
