schema_version: 1
task_manifest: task.yaml

change_ids: ["CHG-deployment-core", "CHG-deployment-safety", "CHG-package-source", "CHG-project-integration", "CHG-environment-deployment", "CHG-secret-delivery"]
source_bindings:
  proposal: proposal.md
  design_source:

risks:
  contract:
    applies: true
    evidence:
      - proposal.md 中的 CLI、集群目录 schema、项目集成 API、脚本上下文 API 和退出码均为新公开契约
      - pipeline/plan.md 的 Exported Interfaces 与 Implementation Scope Bindings 负责接口消费者和兼容性设计
    required_checks:
      - 验证公开 Python API、CLI 参数/退出码、四类 YAML v1 schema、下载提供方协议和远端脚本上下文的成功与失败语义
      - 验证示例项目从任意工作目录调用绑定命令且项目实例互不污染
  data:
    applies: true
    evidence:
      - proposal.md 定义 cluster.yaml、machines.yaml、environment.yaml、app.yaml 及脚本上下文 JSON 的新序列化结构
      - pipeline/plan.md 的 State Ownership 与 Failure Flows 负责解析结果、计划和临时上下文的数据所有权
    required_checks:
      - 验证缺失字段、未知字段、重复身份、无效引用、循环依赖和路径逃逸均在 SSH 前失败
      - 验证临时上下文和结果序列化不泄露配置密钥
      - 验证 v1 配置的版本拒绝策略，且该只读输入格式不产生迁移、回滚或混合版本写入
  security:
    applies: true
    evidence:
      - proposal.md 涉及 SSH host-key 信任、远程命令、文件私钥投递、配置密钥、路径和权限边界
      - pipeline/plan.md 的 Failure Flows 与 Rejected Alternatives 负责失败关闭、最小投递、原子替换和清理决策
    required_checks:
      - 验证严格 known-host、认证凭据隔离、固定远端启动器参数引用、目录包含、绝对目标路径、限制性权限和同目录原子文件替换
      - 验证配置密钥最小投递、占位符白名单、日志脱敏以及成功、失败、超时和取消路径的清理
  runtime:
    applies: true
    evidence:
      - proposal.md 涉及 SSH 连接、下载超时、脚本生命周期、环境/App 依赖顺序、失败传播和资源清理
      - pipeline/plan.md 的 State Ownership、Failure Flows 和文件实现顺序负责运行时所有权与恢复路径
    required_checks:
      - 验证确定性拓扑顺序、目标内 fail-fast、依赖阻断、独立目标继续、跨目标结果汇总、超时/取消传播和清理失败升级
      - 验证环境 check/install 语义、依赖阻断、Python 解释器预检与远端工作区生命周期
  build:
    applies: true
    evidence:
      - 该任务创建首个可安装 Python 包、pyproject.toml、运行依赖和项目命令入口
      - pipeline/plan.md 的 API and Build Surface Impact 与 Consumer Migration Closure 负责构建和消费者闭包
    required_checks:
      - 验证干净环境中包可构建、可安装、可导入，console script 可调用，依赖声明完整且 README 示例与公开 API 一致
      - 验证任务级测试可通过统一 test-run 入口执行
  ui:
    applies: false
    evidence: 任务不创建图形界面、网页、导航、可访问性或本地化工作流，仅提供 CLI
    required_checks: []
  harness:
    applies: false
    evidence: 产品实现不修改 Harness 规则、检查器或流程语义；仅按既有流程注册产品测试
    required_checks: []
