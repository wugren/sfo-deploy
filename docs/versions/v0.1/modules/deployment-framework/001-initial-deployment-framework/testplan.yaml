schema_version: 1
task_manifest: task.yaml
risk_profile: risk-profile.yaml
api_impact:
  public_api: backward-compatible
  crate_root_export_change: false
  build_surface_change: true
  documentation_examples_affected: true
evidence_inputs: ["pyproject.toml", "README.md", "src/deployment_framework", "tests"]
contract_checks:
  mode: enabled
  steps:
    - id: package-build-closure
      kind: repository-compile-closure
      assertion: repository-consumers-compile
      name: 构建 wheel 并验证包内容、公开导出和命令入口
      change_ids: ["CHG-deployment-core", "CHG-deployment-safety", "CHG-package-source", "CHG-project-integration", "CHG-environment-deployment", "CHG-secret-delivery"]
      run: [".venv/Scripts/python.exe", "-m", "pytest", "-q", "tests/contract/test_public_contract.py::test_wheel_build_contains_importable_package", "tests/contract/test_public_contract.py::test_console_module_help_is_callable"]
    - id: readme-example-contract
      kind: documentation-examples
      assertion: documentation-examples-compile
      name: 验证 README 示例引用当前公开 API 和命令
      change_ids: ["CHG-deployment-core", "CHG-deployment-safety", "CHG-package-source", "CHG-project-integration", "CHG-environment-deployment", "CHG-secret-delivery"]
      run: [".venv/Scripts/python.exe", "-m", "pytest", "-q", "tests/contract/test_public_contract.py::test_public_exports_and_readme_examples"]
defaults:
  workdir: .
  timeout_sec: 600
  env: {}
levels:
  unit:
    mode: enabled
    summary: 覆盖严格配置、地址和拓扑、下载边界、环境决策与敏感输入纯逻辑
    test_targets: ["tests/unit"]
    preconditions: {tools: [], env: [], services: [], notes: ["仅启动回环 HTTP 测试服务"]}
    steps:
      - id: deployment-unit
        name: 运行部署框架单元测试
        change_ids: ["CHG-deployment-core", "CHG-package-source", "CHG-environment-deployment", "CHG-secret-delivery"]
        run: [".venv/Scripts/python.exe", "-m", "pytest", "-q", "tests/unit"]
  dv:
    mode: enabled
    summary: 使用 fake SSH/下载提供方验证单模块执行生命周期、失败与清理
    test_targets: ["tests/dv"]
    preconditions: {tools: [], env: [], services: [], notes: ["不连接真实 SSH 主机"]}
    steps:
      - id: deployment-dv
        name: 运行部署执行器 DV 测试
        change_ids: ["CHG-deployment-safety", "CHG-package-source", "CHG-environment-deployment", "CHG-secret-delivery"]
        run: [".venv/Scripts/python.exe", "-m", "pytest", "-q", "tests/dv"]
  integration:
    mode: enabled
    summary: 验证项目绑定 CLI 的成功与失败契约、任意 cwd 和实例隔离
    test_targets: ["tests/integration"]
    preconditions: {tools: [], env: [], services: [], notes: ["不执行真实远端动作"]}
    steps:
      - id: project-cli-integration
        name: 运行项目绑定 CLI 集成测试
        change_ids: ["CHG-deployment-core", "CHG-project-integration", "CHG-secret-delivery"]
        run: [".venv/Scripts/python.exe", "-m", "pytest", "-q", "tests/integration"]
