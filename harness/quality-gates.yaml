# Mechanical quality gates for this repository.
#
# harness/scripts/quality-check.py runs every gate below when explicitly
# requested by the current user or a matching highest-priority custom rule,
# and fails when any gate fails. It records the result under the git-ignored
# .harness/test-results/quality-runs/ directory. Generated rules do not run
# these gates automatically during task execution or acceptance.
#
# Declare the repository's build/lint/typecheck commands here. Gates must be
# non-interactive, deterministic, and return a meaningful exit code.
#
# An explicitly empty list is a versioned, reviewable decision and requires a
# concrete non-placeholder empty_reason. A missing file or reason fails closed.
schema_version: 1
gates: []
empty_reason: No separate repository-wide quality gate is declared; sfo-deploy verification runs through the unified test entrypoint and explicit deno tasks when requested.
# Example (Rust):
# gates:
#   - id: build
#     run: ["cargo", "build", "--workspace"]
#   - id: clippy
#     run: ["cargo", "clippy", "--workspace", "--", "-D", "warnings"]
# Example (Python):
# gates:
#   - id: lint
#     run: ["uv", "run", "--active", "ruff", "check", "."]
#   - id: typecheck
#     run: ["uv", "run", "--active", "mypy", "."]
