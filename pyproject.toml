[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sfo-deploy"
version = "0.1.0"
description = "基于 SSH 和 Python 脚本的可复用集群部署框架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "paramiko>=3.5,<5",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
sfo-deploy = "sfo_deploy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sfo_deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
